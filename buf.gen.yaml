version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: gen/proto/provenance/runner/v1
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: gen/proto/provenance/runner/v1
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: packages/runner-protocol/src/gen
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: proto/provenance/runner/v1
