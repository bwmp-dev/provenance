version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/proto/provenance/runner/v1
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.6.2
    out: gen/proto/provenance/runner/v1
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: packages/runner-protocol/src/gen
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: proto/provenance/runner/v1
