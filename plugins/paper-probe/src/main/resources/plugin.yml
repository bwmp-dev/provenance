name: ProvenanceProbe
version: 0.2.0
main: dev.provenance.probe.PaperProbePlugin
api-version: "1.13"
load: STARTUP
description: Structured lifecycle and command instrumentation for Provenance Paper tests
loadbefore:
  - ProvenanceMatrixCompatibility
  - ProvenanceSuccess
  - ProvenanceOnLoadFailure
  - ProvenanceOnEnableFailure
  - ProvenanceMissingDependency
  - ProvenanceCommandSuccess
  - ProvenanceCommandAssertionFailure
  - ProvenanceEnableHang
  - ProvenanceProcessExit
  - ProvenanceMemoryBomb
  - ProvenanceForkPidBomb
  - ProvenanceDiskFill
  - ProvenanceNetworkScan
  - ProvenanceMetadataEndpoint
  - ProvenanceLogFlood
