name: Testkit release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Dedicated testkit-v* SemVer release tag
        required: true
        type: string
      source_sha:
        description: Full immutable source commit with an audited artifact matrix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testkit-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      policy_sha: ${{ steps.release.outputs.policy_sha }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Validate immutable release request and empty destination
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Testkit releases must be dispatched from refs/heads/main." >&2
            exit 1
          fi
          policy_sha="$(git rev-parse HEAD)"
          if [[ "$policy_sha" != "$GITHUB_SHA" ]]; then
            echo "Release checkout does not match the immutable workflow-dispatch commit." >&2
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          if [[ "$policy_sha" != "$(git rev-parse origin/main)" ]]; then
            echo "Release policy is no longer the current main tip." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source SHA must be a full lowercase commit SHA." >&2
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          if [[ "$(git rev-parse "$SOURCE_SHA^{commit}")" != "$SOURCE_SHA" ]]; then
            echo "Source SHA did not resolve to the exact requested commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SOURCE_SHA" origin/main; then
            echo "Source SHA is not contained in main." >&2
            exit 1
          fi
          node scripts/testkit-release.mjs identity \
            --tag "$TAG" \
            --source-commit "$SOURCE_SHA"

          ensure_absent() {
            local endpoint="$1"
            local label="$2"
            local error_file="$RUNNER_TEMP/testkit-${label}.err"
            if gh api "$endpoint" >/dev/null 2>"$error_file"; then
              echo "A tag or release already exists for $TAG ($label)." >&2
              exit 1
            fi
            if ! grep -Fq '(HTTP 404)' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
          }
          ensure_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" tag
          ensure_absent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" release

          echo "policy_sha=$policy_sha" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          version="${TAG#testkit-v}"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out reviewed release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          path: policy
          persist-credentials: false
          ref: ${{ needs.validate.outputs.policy_sha }}
      - name: Check out immutable testkit source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          path: source
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: source/.node-version
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
          cache: gradle
          cache-dependency-path: |
            source/gradle/wrapper/gradle-wrapper.properties
            source/plugins/paper-probe/gradle.lockfile
      - name: Build and verify all testkit JARs without executing them
        env:
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TAG: ${{ needs.validate.outputs.tag }}
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node ../policy/scripts/testkit-release.mjs identity \
            --tag "$TAG" \
            --source-commit "$SOURCE_SHA"
          node scripts/run-gradle.mjs \
            clean \
            :paper-probe:jar \
            safeFixtures \
            hostileFixtures \
            verifySafeFixtureArtifacts \
            verifyHostileFixtureArtifacts
          node ../policy/scripts/testkit-release.mjs stage \
            --tag "$TAG" \
            --source-commit "$SOURCE_SHA" \
            --source . \
            --directory ../dist/first

          node scripts/run-gradle.mjs \
            clean \
            :paper-probe:jar \
            safeFixtures \
            hostileFixtures \
            verifySafeFixtureArtifacts \
            verifyHostileFixtureArtifacts
          node ../policy/scripts/testkit-release.mjs stage \
            --tag "$TAG" \
            --source-commit "$SOURCE_SHA" \
            --source . \
            --directory ../dist/second
          node ../policy/scripts/testkit-release.mjs compare \
            --tag "$TAG" \
            --source-commit "$SOURCE_SHA" \
            --left ../dist/first \
            --right ../dist/second
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-${{ needs.validate.outputs.tag }}-${{ needs.validate.outputs.source_sha }}
          path: dist/first/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out reviewed release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          path: policy
          persist-credentials: false
          ref: ${{ needs.validate.outputs.policy_sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: policy/.node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: provenance-${{ needs.validate.outputs.tag }}-${{ needs.validate.outputs.source_sha }}
          path: dist/testkit
      - name: Revalidate, create dedicated tag, and publish direct assets
        env:
          GH_TOKEN: ${{ github.token }}
          POLICY_SHA: ${{ needs.validate.outputs.policy_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TAG: ${{ needs.validate.outputs.tag }}
        working-directory: policy
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$POLICY_SHA" ]]; then
            echo "Privileged release checkout does not match reviewed policy." >&2
            exit 1
          fi
          git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
          if [[ "$POLICY_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo "Release policy is no longer the current main tip." >&2
            exit 1
          fi
          git cat-file -e "$SOURCE_SHA^{commit}"
          if [[ "$(git rev-parse "$SOURCE_SHA^{commit}")" != "$SOURCE_SHA" ]]; then
            echo "Source SHA did not resolve to the exact requested commit." >&2
            exit 1
          fi
          node scripts/testkit-release.mjs verify \
            --tag "$TAG" \
            --source-commit "$SOURCE_SHA" \
            --directory ../dist/testkit

          ensure_absent() {
            local endpoint="$1"
            local label="$2"
            local error_file="$RUNNER_TEMP/testkit-release-${label}.err"
            if gh api "$endpoint" >/dev/null 2>"$error_file"; then
              echo "A tag or release already exists for $TAG ($label)." >&2
              exit 1
            fi
            if ! grep -Fq '(HTTP 404)' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
          }
          ensure_absent "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" tag
          ensure_absent "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" release

          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            --method POST \
            --field tag="$TAG" \
            --field message="Immutable Provenance testkit $TAG from $SOURCE_SHA" \
            --field object="$SOURCE_SHA" \
            --field type=commit \
            --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            --method POST \
            --field ref="refs/tags/$TAG" \
            --field sha="$tag_object" >/dev/null

          notes="$RUNNER_TEMP/testkit-release-notes.md"
          printf '%s\n\n%s\n' \
            "Immutable Paper probe and test fixtures built without execution." \
            "Source commit: \`$SOURCE_SHA\`" >"$notes"
          release=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag)
          release+=(--title "Provenance testkit $TAG" --notes-file "$notes")
          if [[ "$PRERELEASE" == "true" ]]; then
            release+=(--prerelease)
          fi
          mapfile -d '' assets < <(find ../dist/testkit -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${#assets[@]}" -ne 17 ]]; then
            echo "Unexpected local testkit asset count." >&2
            exit 1
          fi
          gh "${release[@]}" "${assets[@]}"

          download="$RUNNER_TEMP/testkit-release-download"
          mkdir "$download"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$download"
          node scripts/testkit-release.mjs verify \
            --tag "$TAG" \
            --source-commit "$SOURCE_SHA" \
            --directory "$download"
