name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select the shared store for isolated offline consumers
        run: echo "pnpm_config_store_dir=$RUNNER_TEMP/provenance-pnpm-store" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/provenance-pnpm
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gen/proto/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install --requirement requirements-contracts.txt
      - name: Populate the locked store for isolated offline consumers
        run: pnpm fetch --frozen-lockfile --ignore-scripts
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Verify committed Action distribution
        run: git diff --exit-code -- packages/action/dist
      - name: Test CLI with isolated native Linux Secret Service
        run: bash scripts/test-cli-native-store.sh
      - name: Check Protobuf compatibility
        if: github.ref_name != github.event.repository.default_branch
        run: >-
          pnpm exec buf breaking proto/provenance/runner/v1
          --against "https://github.com/${{ github.repository }}.git#branch=${{ github.event.repository.default_branch }},subdir=proto/provenance/runner/v1"

  cli-native-desktop:
    name: CLI native store (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-amd64
            runner: macos-15-intel
            cgo: "1"
            executable: provenance
          - platform: windows-amd64
            runner: windows-2025
            cgo: "0"
            executable: provenance.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: packages/cli-go/go.sum
      - name: Verify native credential store
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CLI_NATIVE_STORE_REQUIRED: "1"
          GOTOOLCHAIN: local
        shell: bash
        run: >-
          go -C packages/cli-go test
          -count=1
          -run '^TestNativeDesktopCredentialStore$'
          ./internal/securestore
      - name: Build native CLI
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOTOOLCHAIN: local
        shell: bash
        run: |
          mkdir -p dist
          go -C packages/cli-go build \
            -mod=readonly \
            -trimpath \
            -buildvcs=true \
            -o "../../dist/${{ matrix.executable }}" \
            ./cmd/provenance
      - name: Verify native build identity
        env:
          EXECUTABLE: dist/${{ matrix.executable }}
        shell: bash
        run: |
          test -f "$EXECUTABLE"
          info="$(go version -m "$EXECUTABLE")"
          grep -F "vcs.revision=$GITHUB_SHA" <<<"$info"
          grep -F 'vcs.modified=false' <<<"$info"
