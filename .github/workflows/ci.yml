name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache-dependency-path: gen/proto/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21.0.12+8.0.LTS"
          cache: gradle
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contracts.txt
      - run: python -m pip install --requirement requirements-contracts.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Check Protobuf compatibility
        if: github.ref_name != github.event.repository.default_branch
        run: >-
          pnpm exec buf breaking proto/provenance/runner/v1
          --against "https://github.com/${{ github.repository }}.git#branch=${{ github.event.repository.default_branch }},subdir=proto/provenance/runner/v1"
