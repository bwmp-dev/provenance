        default:
          $ref: "#/components/responses/HostedUpdaterProblem503"
components:
  securitySchemes:
    HostedRunnerUpdater:
      bearerFormat: pru_
      description:
        Root-owned per-node updater credential; cannot authorize runner
        jobs or administration.
      scheme: bearer
      type: http
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Capability- and tenant-scoped access token.
    SessionCookie:
      type: apiKey
      in: cookie
      name: provenance_session
      description: Secure browser session cookie.
    GitHubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: GitHub HMAC-SHA256 webhook signature.
    RunnerRegistrationToken:
      type: http
      scheme: bearer
      bearerFormat: prr_v1
      description: >-
        One-time, runner-bound registration token. It authenticates only the
        registration-redemption operation and is atomically consumed there.
  parameters:
    DeviceLoginIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        IFC-020 device initiation/decision key. Different payload reuse
        conflicts. Successful initiation retains only hashes: identical replay
        returns credential_not_replayable, never the original device secret.
        Decisions replay only the matching nonsecret outcome for the same
        currently active user identity. See device-login-semantics.md for
        deadline precedence.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    GitHubConnectionInitiationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required key scoped to initiating session, organization/project, HTTP
        method and route. Same key and exact request returns original
        authorization/state/provider URL/expiry without extension. Different
        content conflicts with idempotency_key_conflict. Current session and
        capability are required for every replay.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    GitHubConnectionCompletionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Required key bound to initiating session, authorization ID and exact
        completion request. Validate state/PKCE before exposing replay status.
        Different content conflicts with idempotency_key_conflict. In-flight
        returns authorization_in_progress; unknown exchange returns
        authorization_completion_uncertain and never retries the code.
        Successful nonsecret results replay within the original configured
        retention window after fresh local access checks, unlike IFC017
        credential_not_replayable. Discovery also requires a live snapshot.
        After retention expiry return authorization_expired without exchanging
        the code. Discovery overflow is terminal discovery_limit_exceeded; use
        fresh authorization.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    GitHubAuthorizationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Same key and request returns the original authorization, state, provider
        URL and expiry without extension. Different request conflicts with
        idempotency_key_conflict. Keys are scoped to this operation.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    GitHubCompletionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Bound to authorization ID and exact completion request. Validate proof
        before revealing replay state. Different request conflicts with
        idempotency_key_conflict. A matching in-flight request returns
        authorization_in_progress. The server retains only a hash of the issued
        exchange token: successful replay returns credential_not_replayable.
        Uncertain upstream code consumption returns
        authorization_completion_uncertain. Neither permits repeating the
        upstream exchange or regenerating the credential; start a new
        authorization and use new idempotency keys.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    ActionsGrantIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Dedicated shown-once issuance semantics: identical successful replay
        yields credential_not_replayable, different request reuse
        idempotency_conflict. Scope is the verified issuer and numeric
        repository, HTTP method and route. Assertion replay identity is checked
        globally per issuer, not per key.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]{8,128}$
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to the authenticated identity, HTTP method,
        and route. Repeating the same key and request returns the original
        outcome; reusing it with a different request conflicts.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    SessionCreationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to browser session creation. Reusing the key
        with a different request conflicts. After a request succeeds, the
        platform retains only a hash of the issued credential and cannot
        reproduce the original Set-Cookie value. Replaying that same request
        therefore fails closed with HTTP 409 and code
        `credential_not_replayable`; the caller must obtain a new one-time
        exchange token and use a new idempotency key.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    SecretCreationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to the authenticated identity, HTTP method,
        and route. Reuse with a different request returns
        `idempotency_key_conflict`. After a successful response containing a
        registration token or connection credential, the authority retains only
        the secret hash and cannot reproduce the plaintext. An identical retry
        therefore returns HTTP 409 `credential_not_replayable`, never a
        replacement secret; recovery requires a new authorized request and a new
        idempotency key.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional caller key. GitHub webhook delivery identity remains anchored
        by the required X-GitHub-Delivery header.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page.
      schema:
        $ref: "#/components/schemas/Cursor"
    PageSize:
      name: limit
      in: query
      required: false
      description: Maximum number of resources to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Opaque release-event reconnect cursor.
      schema:
        $ref: "#/components/schemas/Cursor"
    LogCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque, short-lived live-relay position scoped to the authenticated
        tenant, candidate, execution, and attempt. It resumes strictly after the
        identified event and never promises durable replay.
      schema:
        $ref: "#/components/schemas/LogCursor"
    LogPageSize:
      name: limit
      in: query
      required: false
      description: >-
        Maximum number of ExecutionLogEvent values in a JSON reconciliation
        page, including gap and state events. It is invalid for SSE.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    LogLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        SSE reconnect cursor. When both cursor forms are present they must be
        byte-for-byte equal. Any Last-Event-ID is invalid for JSON, and every
        SSE reconnect independently reauthorizes and validates the selected
        cursor.
      schema:
        $ref: "#/components/schemas/LogCursor"
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BoundedStableId"
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    OwnerSlug:
      name: ownerSlug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    ProjectSlug:
      name: projectSlug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    GitHubDeliveryId:
