components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Capability- and tenant-scoped access token.
    SessionCookie:
      type: apiKey
      in: cookie
      name: provenance_session
      description: Secure browser session cookie.
    GitHubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: GitHub HMAC-SHA256 webhook signature.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to the authenticated identity, HTTP method,
        and route. Repeating the same key and request returns the original
        outcome; reusing it with a different request conflicts.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    SessionCreationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to browser session creation. Reusing the
        key with a different request conflicts. After a request succeeds, the
        platform retains only a hash of the issued credential and cannot
        reproduce the original Set-Cookie value. Replaying that same request
        therefore fails closed with HTTP 409 and code
        `credential_not_replayable`; the caller must obtain a new one-time
        exchange token and use a new idempotency key.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional caller key. GitHub webhook delivery identity remains anchored
        by the required X-GitHub-Delivery header.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page.
      schema:
        $ref: "#/components/schemas/Cursor"
    PageSize:
      name: limit
      in: query
      required: false
      description: Maximum number of resources to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Opaque release-event reconnect cursor.
      schema:
        $ref: "#/components/schemas/Cursor"
    LogCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque, short-lived live-relay position scoped to the authenticated
        tenant, candidate, execution, and attempt. It resumes strictly after the
        identified event and never promises durable replay.
      schema:
        $ref: "#/components/schemas/LogCursor"
    LogLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        SSE reconnect cursor. It takes precedence over the query cursor; when
        both are present they must be byte-for-byte equal. It is invalid for the
        JSON representation and is reauthorized on every reconnect.
      schema:
        $ref: "#/components/schemas/LogCursor"
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BoundedStableId"
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    OwnerSlug:
      name: ownerSlug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    ProjectSlug:
      name: projectSlug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    GitHubDeliveryId:
      name: X-GitHub-Delivery
      in: header
      required: true
      schema:
        type: string
        format: uuid
    GitHubEvent:
      name: X-GitHub-Event
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    UsageFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
    UsageTo:
      name: to
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
  headers:
    SessionCookie:
      description: HttpOnly, Secure browser session cookie.
      schema:
        type: string
    PrivateNoStore:
      required: true
      description: Private log responses must not be stored by shared or browser caches.
      schema:
        type: string
        const: private, no-store
    VaryAccept:
      required: true
      description: Content negotiation varies the representation by Accept.
      schema:
        type: string
        const: Accept
    RetryAfter:
      required: true
      description: Bounded delay in seconds before retrying.
      schema:
        type: integer
        minimum: 1
        maximum: 60
    CompleteLogContentDigest:
      required: true
      description: RFC 9530 SHA-256 digest of the exact compressed response bytes.
      schema:
        type: string
        minLength: 54
        maxLength: 54
        pattern: ^sha-256=:[A-Za-z0-9+/]{43}=:$
    CompleteLogContentLength:
      required: true
      description: Exact compressed response size in bytes.
      schema:
        type: integer
        minimum: 1
        maximum: 269484032
    CompleteLogContentDisposition:
      required: true
      description: Bounded attachment filename; it never contains a storage object key.
      schema:
        type: string
        minLength: 29
        maxLength: 96
        pattern: ^attachment; filename="execution-[0-9a-f-]{36}\.log\.gz"$
  responses:
    NoContent:
      description: Mutation completed successfully.
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    AuthenticationRequired:
      description: Authentication is required; no private resource identity is disclosed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PrivateLogNotFound:
      description: >-
        The private candidate or execution does not exist or the authenticated
        principal is not authorized to access it. Both cases use the identical
        status and problem shape to avoid cross-tenant identity disclosure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    LogCursorConflict:
      description: >-
        The cursor is malformed, Last-Event-ID was used with JSON, or the query
        cursor and Last-Event-ID differ. Stable codes are `invalid_log_cursor`,
        `last_event_id_not_applicable`, and `log_cursor_conflict`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    LogRepresentationNotAcceptable:
      description: >-
        Accept does not permit application/json or text/event-stream. Code
        `log_representation_not_acceptable` is returned.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    LogRateLimited:
      description: The authenticated identity or relay subscriber limit was reached.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    LogRelayUnavailable:
      description: >-
        The best-effort live relay is unavailable. The client must reconcile
        execution state and complete-log status; this is not evidence that the
        execution or authoritative completed log failed.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    CompleteLogNotReady:
      description: >-
        Terminal complete-log verification or durable metadata persistence is
        still pending. Code `complete_log_not_ready` is returned.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    CompleteLogUnavailable:
      description: >-
        The complete log failed verification/persistence or was not produced.
        Code `complete_log_unavailable` is returned; structured result evidence
        remains a separate resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    CompleteLogExpired:
      description: >-
        The private complete log passed its retention boundary and is no longer
        downloadable. Code `complete_log_expired` is returned.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    IdempotencyConflict:
      description: The idempotency key was reused with a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    SessionCreationConflict:
      description: |
        Browser session creation encountered an idempotency conflict. Reusing
        the key with a different request returns code
        `idempotency_key_conflict`.

        Replaying the same request after its session credential was issued
        returns code `credential_not_replayable`, because the hash-only session
        store cannot reproduce the original Set-Cookie credential. The server
        does not mint a replacement credential for that replay. The caller must
        obtain a new one-time exchange token and use a new idempotency key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ReleaseCandidateConflict:
      description: |
        Release candidate creation conflicted with an existing resource or
        idempotency record. Reusing an idempotency key with a different request
        returns code `idempotency_key_conflict`.

        When `configurationSnapshotId` is present, the identified snapshot must
        exist in the path project and its `configurationHash` must equal the
        request value. A missing ID returns `configuration_snapshot_not_found`;
        a project or hash mismatch returns `configuration_snapshot_mismatch`.

        When `configurationSnapshotId` is absent, exactly one snapshot in the
        path project must match `configurationHash`. Zero matches return
        `configuration_snapshot_not_found`; multiple matches return
        `configuration_snapshot_ambiguous`. All listed conflicts use HTTP 409.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  requestBodies:
    CreateSession:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateSessionRequest"
    CreateDeviceAuthorization:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateDeviceAuthorizationRequest"
    ExchangeGitHubOidcToken:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ExchangeGitHubOidcTokenRequest"
    CreateOrganization:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateOrganizationRequest"
    UpdateOrganization:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateOrganizationRequest"
    CreateProject:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateProjectRequest"
    UpdateProject:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateProjectRequest"
    CreateProjectConfigSnapshot:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateProjectConfigSnapshotRequest"
    CreateGitHubConnection:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateGitHubConnectionRequest"
    GitHubWebhook:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    CreateArtifactUpload:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateArtifactUploadRequest"
    CompleteArtifactUpload:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompleteArtifactUploadRequest"
    CreateReleaseCandidate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateReleaseCandidateRequest"
    CandidateDecision:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CandidateDecisionRequest"
    CreateIntegration:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateIntegrationRequest"
    UpdateIntegration:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateIntegrationRequest"
    CreateRunnerRegistration:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CreateRunnerRegistrationRequest"
    UpdateRunner:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UpdateRunnerRequest"
  schemas:
    StableId:
      type: string
      format: uuid
      description: Stable resource identifier.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with an explicit UTC offset.
    Slug:
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      minLength: 1
      maxLength: 63
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination or event continuation cursor.
    LogCursor:
      type: string
      minLength: 16
      maxLength: 1024
      pattern: ^[A-Za-z0-9._~-]+$
      description: Opaque, short-lived live-log relay position; clients must not parse it.
    BoundedStableId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      description: Canonical bounded UUID resource identifier.
    LogTimestamp:
      type: string
      format: date-time
      minLength: 20
      maxLength: 35
      description: Bounded RFC 3339 timestamp with an explicit UTC offset.
    LogSequence:
      type: string
      minLength: 1
      maxLength: 20
      pattern: ^(?:0|[1-9][0-9]{0,19})$
      description: Unsigned runner log sequence represented as decimal text without precision loss.
    DroppedLogCount:
      type: string
      minLength: 1
      maxLength: 20
      pattern: ^[1-9][0-9]{0,19}$
      description: Positive unsigned count represented as decimal text without precision loss.
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]{8,128}$
    Sha256Digest:
      type: string
      pattern: ^[a-f0-9]{64}$
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 2048
    ProblemDetails:
      type: object
      description: RFC 9457 problem details with stable Provenance extensions.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
      additionalProperties: true
    ProblemFieldError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        path:
          type: string
        message:
          type: string
          minLength: 1
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
    SessionState:
      type: string
      enum: [active, expired, revoked]
    ArtifactState:
      type: string
      enum: [pending, uploaded, verifying, ready, rejected, deleted]
    ReleaseCandidateState:
      type: string
      enum:
        - pending
        - testing
        - awaiting_approval
        - approved
        - canceled
        - failed
        - publishing
        - published
    VerificationState:
      type: string
      enum: [pending, verified, failed]
    IntegrationState:
      type: string
      enum: [active, disabled, error]
    RunnerState:
      type: string
      enum: [offline, idle, busy, draining]
    Session:
      type: object
      additionalProperties: false
      required: [id, userId, state, createdAt, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        userId:
          $ref: "#/components/schemas/StableId"
        state:
          $ref: "#/components/schemas/SessionState"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [exchangeToken]
      properties:
        exchangeToken:
          type: string
          minLength: 1
          writeOnly: true
    CreateDeviceAuthorizationRequest:
      type: object
      additionalProperties: false
      properties:
        clientName:
          type: string
          minLength: 1
          maxLength: 128
    DeviceAuthorization:
      type: object
      additionalProperties: false
      required:
        [deviceCode, userCode, verificationUri, expiresAt, intervalSeconds]
      properties:
        deviceCode:
          type: string
          minLength: 1
          description: One-time device exchange secret.
        userCode:
          type: string
          minLength: 1
        verificationUri:
          type: string
          format: uri
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        intervalSeconds:
          type: integer
          minimum: 1
    ExchangeGitHubOidcTokenRequest:
      type: object
      additionalProperties: false
      required: [assertion]
      properties:
        assertion:
          type: string
          minLength: 1
          writeOnly: true
    AccessToken:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt]
      properties:
        accessToken:
          type: string
          minLength: 1
