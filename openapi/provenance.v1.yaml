          required: [code]
          properties:
            code:
              type: string
              const: log_rate_limited
    LogRelayUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: log_relay_unavailable
    CompleteLogNotReadyProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: complete_log_not_ready
    CompleteLogUnavailableProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: complete_log_unavailable
    CompleteLogExpiredProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: complete_log_expired
    SessionState:
      type: string
      enum: [active, expired, revoked]
    ArtifactState:
      type: string
      enum: [pending, uploaded, verifying, ready, rejected, deleted]
    ReleaseCandidateState:
      type: string
      enum:
        - pending
        - testing
        - awaiting_approval
        - approved
        - canceled
        - failed
        - publishing
        - published
    VerificationState:
      type: string
      enum: [pending, verified, failed]
    IntegrationState:
      type: string
      enum: [active, disabled, error]
    RunnerState:
      type: string
      enum: [registering, offline, idle, busy, draining, quarantined, revoked]
      description: >-
        `registering` has an unconsumed enrollment token and no credential;
        `offline` is enrolled without a live connection; `idle` and `busy` are
        connected; `draining` accepts no new work; `quarantined` rejects every
        credential and job until authorized recovery; `revoked` is terminal and
        rejects registration tokens, current/predecessor credentials, and
        streams while retaining audit identity.
    Session:
      type: object
      additionalProperties: false
      required: [id, userId, state, createdAt, expiresAt]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
