          description: >-
            Valid normalized UTF-8 text, at most 16384 encoded bytes. Invalid
            source bytes are replaced before delivery. In SSE the compact JSON
            encoding escapes embedded CR, LF, and NUL so data remains one line.
        partial:
          type: boolean
          description: True when data is a fragment rather than a complete line.
