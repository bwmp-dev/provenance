  headers:
    AlphaNoStore:
      description: Never cache account or administrator responses.
      schema:
        type: string
        const: no-store
    ActionsGrantNoStore:
      description: Confidential issuance and all failures must not be cached.
      schema:
        type: string
        const: no-store
    DeviceLoginNoStore:
      description: Required for every device-login response, including errors.
      schema:
        type: string
        const: no-store
    DeviceLoginRetryAfter:
      description: Required on 429; positive integer seconds, never an HTTP date.
      schema:
        type: string
        pattern: '^(?:[1-9][0-9]{0,3}|[1-7][0-9]{4}|8[0-5][0-9]{3}|86[0-3][0-9]{2}|86400)(?![\s\S])'
    GitHubAuthNoStore:
      required: true
      description: Authentication responses must never be cached.
      schema:
        type: string
        const: no-store
    SessionCookie:
      description: HttpOnly, Secure browser session cookie.
      schema:
        type: string
    PrivateNoStore:
      required: true
      description: Private log responses must not be stored by shared or browser caches.
      schema:
        type: string
        const: private, no-store
    VaryAccept:
      required: true
      description: Content negotiation varies the representation by Accept.
      schema:
        type: string
        const: Accept
    BearerChallenge:
      required: true
      description: Bounded RFC 9110 Bearer authentication challenge.
      schema:
        type: string
        minLength: 25
        maxLength: 25
        const: Bearer realm="provenance"
    RetryAfter:
      required: true
      description: Bounded delay in seconds before retrying.
      schema:
        type: integer
        minimum: 1
        maximum: 60
    CompleteLogContentDigest:
      required: true
      description: RFC 9530 SHA-256 digest of the exact compressed response bytes.
      schema:
        type: string
        minLength: 54
        maxLength: 54
        pattern: ^sha-256=:[A-Za-z0-9+/]{43}=:$
    CompleteLogContentLength:
      required: true
      description: Exact compressed response size in bytes.
      schema:
        type: integer
        minimum: 1
        maximum: 269484032
    CompleteLogContentDisposition:
      required: true
      description: Bounded attachment filename; it never contains a storage object key.
      schema:
        type: string
        minLength: 29
        maxLength: 96
        pattern: ^attachment; filename="execution-[0-9a-f-]{36}\.log\.gz"$
