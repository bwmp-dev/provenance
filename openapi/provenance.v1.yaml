            $ref: "#/components/schemas/Runner"
        page:
          $ref: "#/components/schemas/PageInfo"
    CreateRunnerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    RunnerRegistration:
      type: object
      additionalProperties: false
      required: [runnerId, registrationToken, expiresAt]
      properties:
        runnerId:
          $ref: "#/components/schemas/StableId"
        registrationToken:
          type: string
          minLength: 1
          description: One-time runner registration token.
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    UpdateRunnerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        draining:
          type: boolean
    RunnerCredential:
      type: object
      additionalProperties: false
      required: [credential, expiresAt]
      properties:
        credential:
          type: string
          minLength: 1
          description: Short-lived organization-scoped runner credential.
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    Usage:
      type: object
      additionalProperties: false
      required:
        - organizationId
        - from
        - to
        - runnerWallSeconds
        - allocatedCpuSeconds
        - allocatedMemoryByteSeconds
        - artifactBytes
        - logBytes
        - egressBytes
        - matrixExecutions
        - publicationAttempts
      properties:
        organizationId:
          $ref: "#/components/schemas/StableId"
        from:
          $ref: "#/components/schemas/Timestamp"
        to:
          $ref: "#/components/schemas/Timestamp"
        runnerWallSeconds:
          type: integer
          minimum: 0
        allocatedCpuSeconds:
          type: number
          minimum: 0
        allocatedMemoryByteSeconds:
          type: integer
          minimum: 0
        artifactBytes:
          type: integer
          minimum: 0
        logBytes:
          type: integer
          minimum: 0
        egressBytes:
          type: integer
          minimum: 0
        matrixExecutions:
          type: integer
          minimum: 0
        publicationAttempts:
          type: integer
          minimum: 0
