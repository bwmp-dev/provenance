      description: >-
        Accept does not permit application/json or text/event-stream. Code
        `log_representation_not_acceptable` is returned.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogRepresentationNotAcceptableProblem"
    LogCursorExpired:
      description: >-
        The valid, correctly scoped live cursor passed its short retention
        boundary. Code `log_cursor_expired` is returned. This is distinct from
        an accepted cursor whose position predates retained relay bytes, which
        returns HTTP 200 with a `log-gap` event.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogCursorExpiredProblem"
    LogRateLimited:
      description: The authenticated identity or relay subscriber limit was reached.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogRateLimitedProblem"
    LogRelayUnavailable:
      description: >-
        The best-effort live relay is unavailable. The client must reconcile
        execution state and complete-log status; this is not evidence that the
        execution or authoritative completed log failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogRelayUnavailableProblem"
    CompleteLogNotReady:
      description: >-
        Terminal complete-log verification or durable metadata persistence is
        still pending. Code `complete_log_not_ready` is returned.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CompleteLogNotReadyProblem"
    CompleteLogUnavailable:
      description: >-
        The complete log failed verification/persistence or was not produced.
        Code `complete_log_unavailable` is returned; structured result evidence
        remains a separate resource.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CompleteLogUnavailableProblem"
    CompleteLogExpired:
      description: >-
        The private complete log passed its retention boundary and is no longer
        downloadable. Code `complete_log_expired` is returned.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CompleteLogExpiredProblem"
    IdempotencyConflict:
      description: The idempotency key was reused with a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RegistrationTokenInvalid:
      description: >-
        The registration token is invalid, is bound to another runner, or does
        not authorize this request. All cases use HTTP 401 and code
        `registration_token_invalid` without disclosing runner or tenant
        identity.
      headers:
        WWW-Authenticate:
          description: Registration-token Bearer challenge.
          schema:
            type: string
            const: Bearer realm="runner-registration", error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RegistrationTokenInvalidProblem"
    RegistrationTokenExpired:
      description: >-
        The authenticated one-time token expired before atomic consumption.
        Returns HTTP 410 and code `registration_token_expired`; no credential is
        issued and the runner remains registering.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RegistrationTokenExpiredProblem"
    RegistrationProofInvalid:
      description: >-
        The public key or Ed25519 possession proof is malformed or does not
        verify over the exact domain-separated message. Returns HTTP 422 and
        code `registration_proof_invalid`; token consumption and key binding do
        not occur.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RegistrationProofInvalidProblem"
    RegistrationRedemptionConflict:
      description: |
        Registration redemption conflicted with durable state. A token already
        consumed by another request returns `registration_token_consumed`; a
        runner already bound to different key material returns
        `runner_key_conflict`; reuse of an idempotency key with a different
        request returns `idempotency_key_conflict`.

        If the same request committed and its plaintext credential response was
        lost, an identical retry returns `credential_not_replayable`. The
        authority stores only its hash and does not mint a replacement. Every
        conflict is HTTP 409 and leaves the committed binding unchanged.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/RegistrationRedemptionConflictProblem"
    SessionCreationConflict:
      description: |
        Browser session creation encountered an idempotency conflict. Reusing
        the key with a different request returns code
        `idempotency_key_conflict`.

        Replaying the same request after its session credential was issued
        returns code `credential_not_replayable`, because the hash-only session
        store cannot reproduce the original Set-Cookie credential. The server
        does not mint a replacement credential for that replay. The caller must
        obtain a new one-time exchange token and use a new idempotency key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ReleaseCandidateConflict:
      description: |
        Release candidate creation conflicted with an existing resource or
        idempotency record. Reusing an idempotency key with a different request
        returns code `idempotency_key_conflict`.

        When `configurationSnapshotId` is present, the identified snapshot must
        exist in the path project and its `configurationHash` must equal the
        request value. A missing ID returns `configuration_snapshot_not_found`;
        a project or hash mismatch returns `configuration_snapshot_mismatch`.

        When `configurationSnapshotId` is absent, exactly one snapshot in the
        path project must match `configurationHash`. Zero matches return
        `configuration_snapshot_not_found`; multiple matches return
        `configuration_snapshot_ambiguous`. All listed conflicts use HTTP 409.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    AlphaProblem400:
