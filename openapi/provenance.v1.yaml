openapi: 3.1.1
info:
  title: Provenance Public API
  version: 1.0.0-alpha.1
  description: >-
    Authoritative public HTTP contract for Provenance. This document defines
    resource shapes and protocol semantics; it does not prescribe private
    platform implementation details.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Same-origin API endpoint.
security:
  - BearerAuth: []
  - SessionCookie: []
tags:
  - name: authentication
    description: User, automation, and GitHub OIDC authentication.
  - name: organizations-projects
    description: Tenant and project resources.
  - name: github
    description: GitHub App installations, repository connections, and webhooks.
  - name: artifacts
    description: Immutable plugin artifact upload and inspection.
  - name: release-candidates
    description: Release candidate lifecycle and events.
  - name: verification
    description: Verification records, attestations, public pages, and badges.
  - name: integrations
    description: Project release integrations.
  - name: runners
    description: Organization-scoped self-hosted runner management.
  - name: usage
    description: Organization usage observations.
paths:
  /v1/auth/sessions:
    post:
      operationId: createSession
      summary: Create a browser session from a one-time exchange token
      tags: [authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/SessionCreationIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateSession"
      responses:
        "201":
          description: Session created.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          $ref: "#/components/responses/SessionCreationConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/session:
    get:
      operationId: getCurrentSession
      summary: Read the current browser session
      tags: [authentication]
      security:
        - SessionCookie: []
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteCurrentSession
      summary: Revoke the current browser session
      tags: [authentication]
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/device-authorizations:
    post:
      operationId: createDeviceAuthorization
      summary: Begin a one-time device authorization
      tags: [authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateDeviceAuthorization"
      responses:
        "201":
          description: Device authorization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorization"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/auth/github-oidc/exchanges:
    post:
      operationId: exchangeGitHubOidcToken
      summary: Exchange a GitHub Actions OIDC assertion for a scoped token
      tags: [authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/ExchangeGitHubOidcToken"
      responses:
        "200":
          description: Scoped access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessToken"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: List organizations visible to the caller
      tags: [organizations-projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Organization page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createOrganization
      summary: Create an organization
      tags: [organizations-projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateOrganization"
      responses:
        "201":
          description: Organization created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganization
      summary: Read an organization
      tags: [organizations-projects]
      responses:
        "200":
          description: Organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateOrganization
      summary: Update an organization
      tags: [organizations-projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateOrganization"
      responses:
        "200":
          description: Updated organization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteOrganization
      summary: Delete an organization
      tags: [organizations-projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organizationId}/projects:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: listProjects
      summary: List projects in an organization
      tags: [organizations-projects]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Project page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createProject
      summary: Create a project in an organization
      tags: [organizations-projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateProject"
      responses:
        "201":
          description: Project created.
          headers:
            Location:
              description: Canonical project resource URL.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      operationId: getProject
      summary: Read a project
      tags: [organizations-projects]
      responses:
        "200":
          description: Project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateProject
      summary: Update a project
      tags: [organizations-projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateProject"
      responses:
        "200":
          description: Updated project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteProject
      summary: Delete a project
      tags: [organizations-projects]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/projects/{projectId}/config-snapshots:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createProjectConfigSnapshot
      summary: Validate and persist an immutable project configuration snapshot
      tags: [organizations-projects]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateProjectConfigSnapshot"
      responses:
        "201":
          description: Configuration snapshot created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectConfigSnapshot"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /v1/github/installations:
    get:
      operationId: listGitHubInstallations
      summary: List GitHub App installations visible to the caller
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: GitHub installation page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubInstallationPage"
        default:
          $ref: "#/components/responses/Problem"
  /v1/github/connections:
    post:
      operationId: createGitHubConnection
      summary: Connect a GitHub repository to a project
      tags: [github]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateGitHubConnection"
      responses:
        "201":
          description: GitHub repository connection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubConnection"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/github/webhooks:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a signed GitHub App webhook delivery
      tags: [github]
      security:
        - GitHubWebhookSignature: []
      parameters:
        - $ref: "#/components/parameters/OptionalIdempotencyKey"
        - $ref: "#/components/parameters/GitHubDeliveryId"
        - $ref: "#/components/parameters/GitHubEvent"
      requestBody:
        $ref: "#/components/requestBodies/GitHubWebhook"
      responses:
        "202":
          description: Webhook accepted for processing.
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/projects/{projectId}/artifacts/uploads:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createArtifactUpload
      summary: Initiate an artifact upload
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateArtifactUpload"
      responses:
        "201":
          description: Artifact upload initiated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactUpload"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/artifacts/{artifactId}/complete:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    post:
      operationId: completeArtifactUpload
      summary: Complete and independently verify an artifact upload
      tags: [artifacts]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CompleteArtifactUpload"
      responses:
        "202":
          description: Artifact verification accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/artifacts/{artifactId}:
    parameters:
      - $ref: "#/components/parameters/ArtifactId"
    get:
      operationId: getArtifact
      summary: Read artifact metadata and verification state
      tags: [artifacts]
      responses:
        "200":
          description: Artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artifact"
        default:
          $ref: "#/components/responses/Problem"
  /v1/projects/{projectId}/release-candidates:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      operationId: createReleaseCandidate
      summary: Create a release candidate from immutable inputs
      tags: [release-candidates]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CreateReleaseCandidate"
      responses:
        "201":
          description: Release candidate created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCandidate"
        "409":
          $ref: "#/components/responses/ReleaseCandidateConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    get:
      operationId: getReleaseCandidate
      summary: Read a release candidate
      tags: [release-candidates]
      responses:
        "200":
          description: Release candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCandidate"
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}/approve:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      operationId: approveReleaseCandidate
      summary: Approve a release candidate
      tags: [release-candidates]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CandidateDecision"
      responses:
        "200":
          description: Updated release candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCandidate"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}/cancel:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      operationId: cancelReleaseCandidate
      summary: Cancel a release candidate
      tags: [release-candidates]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/CandidateDecision"
      responses:
        "200":
          description: Updated release candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCandidate"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}/retry:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      operationId: retryReleaseCandidate
      summary: Retry an eligible release candidate
      tags: [release-candidates]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Retry accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseCandidate"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}/events:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    get:
      operationId: listReleaseCandidateEvents
      summary: Read release events using an opaque reconnect cursor
      tags: [release-candidates]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/LastEventId"
      responses:
        "200":
          description: Release event page or server-sent event stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseEventPage"
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}/executions:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    get:
      operationId: listReleaseCandidateExecutions
      summary: List the bounded execution log descriptors for a release candidate
      description: >-
        Returns the execution and attempt identities needed to consume logs for
        every matrix environment in the candidate. An authenticated caller that
        cannot access the private candidate receives the same HTTP 404 response
        as a caller naming a nonexistent candidate.
      tags: [release-candidates]
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Bounded execution log descriptor page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLogDescriptorPage"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/PrivateLogNotFound"
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}/executions/{executionId}/logs:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
      - $ref: "#/components/parameters/ExecutionId"
    get:
      operationId: readExecutionLogs
      summary: Reconcile or stream the bounded live log for one execution
      description: |
        This authenticated route exposes a convenience live view, not durable
        evidence. `application/json` is the default for a missing Accept header,
        `*/*`, or an equal preference. `text/event-stream` is selected only when
        it is explicitly the most preferred supported representation.

        The query `cursor` is used for JSON reconciliation and an initial SSE
        request. For SSE reconnects, `Last-Event-ID` takes precedence. Supplying
        both is accepted only when their opaque values are byte-for-byte equal;
        different values fail with HTTP 400 and code `log_cursor_conflict`.
        `Last-Event-ID` with the JSON representation fails with HTTP 400 and code
        `last_event_id_not_applicable`. A cursor is scoped to the authenticated
        tenant, candidate, execution, and attempt. Invalid cursors fail with HTTP
        400; a cursor scoped to another private resource is indistinguishable
        from a missing resource and returns HTTP 404.

        Live relay cursors are opaque, short-lived positions and never promise
        replay of missed bytes. If an accepted cursor precedes retained relay
        state, the response explicitly reports an unrecoverable live gap. The
        client must reconcile terminal state and use the authoritative complete
        log when it becomes available. Structured results and assertions are
        separate resources and are never inferred from this stream.
      tags: [release-candidates]
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/LogCursor"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/LogLastEventId"
      responses:
        "200":
          description: |
            Bounded JSON reconciliation page or a streaming SSE response.

            The SSE grammar is UTF-8 and each data-bearing event is exactly
            `id: <opaque cursor>`, one `event:` line (`log-entry`, `log-gap`,
            `log-state`, or `complete-log-state`), one `data:` line containing a
            compact single-line JSON `ExecutionLogEvent`, then a blank line. The
            cursor in `id:` resumes strictly after that event. No data-bearing
            frame exceeds 65536 encoded bytes. A server may send `retry:` between
            1000 and 30000 milliseconds. While an open stream is idle, the server
            sends a heartbeat every 15 to 30 seconds. Heartbeats are comment
            records of the form `: heartbeat` followed by a blank line, carry no
            id or data, and are never log or terminal evidence.

            Servers flush batches of at most 100 data events and 1 MiB of
            serialized event data incrementally, and apply the same bounds to the
            per-connection queue. They do not assemble the complete response in
            memory. Before response headers, subscriber pressure may return HTTP
            429. After streaming starts, overload or disconnect closes the
            connection; reconnect and JSON reconciliation then expose any
            unrecoverable live gap. Every initial request and reconnect is
            independently authenticated and authorized.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Vary:
              $ref: "#/components/headers/VaryAccept"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionLogPage"
            text/event-stream:
              schema:
                type: string
                description: Incrementally flushed SSE frames; consumers must not buffer the stream as one string.
                x-provenance-streaming: true
                x-provenance-max-event-bytes: 65536
                x-provenance-event-schema: "#/components/schemas/ExecutionLogEvent"
        "400":
          $ref: "#/components/responses/LogCursorConflict"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/PrivateLogNotFound"
        "406":
          $ref: "#/components/responses/LogRepresentationNotAcceptable"
        "429":
          $ref: "#/components/responses/LogRateLimited"
        "503":
          $ref: "#/components/responses/LogRelayUnavailable"
        default:
          $ref: "#/components/responses/Problem"
  /v1/release-candidates/{candidateId}/executions/{executionId}/logs/complete:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
      - $ref: "#/components/parameters/ExecutionId"
    get:
      operationId: downloadCompleteExecutionLog
      summary: Stream the authoritative immutable completed gzip log
      description: |
        Streams the verified gzip object only after terminal metadata is durable.
        This same-origin route independently authenticates every request and
        never redirects to object storage, exposes an object key, returns storage
        credentials, or issues a presigned or other durable download capability.
        An authenticated caller that cannot access the private candidate or
        execution receives the same HTTP 404 response as a nonexistent resource.

        The response body is the exact stored gzip representation. Content-Type
        is `application/gzip`; Content-Encoding MUST be absent so user agents do
        not transparently decode the bytes covered by Content-Digest. Servers
        stream at most 269484032 compressed bytes and do not buffer the object in
        memory. Structured result and assertion evidence remains separate.
      tags: [release-candidates]
      security:
        - BearerAuth: []
        - SessionCookie: []
      responses:
        "200":
          description: Authoritative immutable completed gzip log.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PrivateNoStore"
            Content-Digest:
              $ref: "#/components/headers/CompleteLogContentDigest"
            Content-Length:
              $ref: "#/components/headers/CompleteLogContentLength"
            Content-Disposition:
              $ref: "#/components/headers/CompleteLogContentDisposition"
          content:
            application/gzip:
              schema:
                type: string
                format: binary
                contentMediaType: application/gzip
                x-provenance-streaming: true
                x-provenance-max-bytes: 269484032
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "404":
          $ref: "#/components/responses/PrivateLogNotFound"
        "409":
          $ref: "#/components/responses/CompleteLogUnavailable"
        "410":
          $ref: "#/components/responses/CompleteLogExpired"
        "425":
          $ref: "#/components/responses/CompleteLogNotReady"
        default:
          $ref: "#/components/responses/Problem"
  /v1/verifications/{verificationId}:
    parameters:
      - $ref: "#/components/parameters/VerificationId"
    get:
      operationId: getVerification
      summary: Read a verification record
      tags: [verification]
      responses:
        "200":
          description: Verification record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        default:
          $ref: "#/components/responses/Problem"
  /v1/verifications/{verificationId}/attestation:
    parameters:
      - $ref: "#/components/parameters/VerificationId"
    get:
      operationId: getVerificationAttestation
      summary: Read the signed v1 attestation for a verification
      tags: [verification]
      responses:
        "200":
          description: Signed Provenance attestation.
          content:
            application/json:
              schema:
                $ref: "../schemas/attestation/v1/schema.json"
        default:
          $ref: "#/components/responses/Problem"
  /v1/public/{ownerSlug}/{projectSlug}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/OwnerSlug"
      - $ref: "#/components/parameters/ProjectSlug"
      - $ref: "#/components/parameters/Version"
    get:
      operationId: getPublicRelease
