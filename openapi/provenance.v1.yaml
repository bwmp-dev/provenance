  schemas:
    HostedRunnerMutationResult:
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 36
      required:
        - id
      type: object
    HostedRunnerRelease:
      additionalProperties: false
      properties:
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        signature:
          pattern: ^[A-Za-z0-9+/]{86}==$
          maxLength: 88
          minLength: 88
          type: string
        sizeBytes:
          format: int64
          maximum: 536870912
          minimum: 1
          type: integer
        url:
          maxLength: 2048
          minLength: 1
          type: string
          pattern: ^https://
        version:
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$
          type: string
          maxLength: 128
      required:
        - version
        - url
        - sha256
        - sizeBytes
        - signature
      type: object
    HostedRunnerUpdate:
      additionalProperties: false
      properties:
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        id:
          type: string
          maxLength: 36
        previousVersion:
          type: string
          maxLength: 128
        releaseSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        runnerId:
          type: string
          maxLength: 36
        state:
          enum:
            - draining
            - installing
            - verifying
            - succeeded
            - rolled_back
            - failed
            - cancelled
          type: string
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
      required:
        - id
        - runnerId
        - releaseSha256
        - state
        - previousVersion
        - createdAt
        - updatedAt
      type: object
    HostedRunnerUpdateRequest:
      additionalProperties: false
      properties:
        action:
          enum:
            - configure
            - publish
            - update
            - cancel
          type: string
        credentialSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        operationId:
          type: string
          maxLength: 36
        release:
          $ref: "#/components/schemas/HostedRunnerRelease"
        releasePublicKey:
          type: string
          pattern: ^[A-Za-z0-9+/]{43}=$
          minLength: 44
          maxLength: 44
        releaseSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          minLength: 64
          maxLength: 64
        runnerId:
          type: string
          maxLength: 36
      required:
        - action
      type: object
    HostedRunnerUpdateView:
      additionalProperties: false
      properties:
        releases:
          items:
            $ref: "#/components/schemas/HostedRunnerRelease"
          type:
            - array
            - "null"
          maxItems: 50
        updaterConfigured:
          type: boolean
        updaterLastSeenAt:
          anyOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        updates:
          items:
            $ref: "#/components/schemas/HostedRunnerUpdate"
          type:
            - array
            - "null"
          maxItems: 50
      required:
        - releases
        - updates
        - updaterConfigured
        - updaterLastSeenAt
      type: object
    HostedUpdaterCommand:
      additionalProperties: false
      properties:
        healthy:
          type: boolean
        operationId:
          type: string
          maxLength: 36
        outcome:
          type: string
          enum:
            - ""
            - succeeded
            - rolled_back
            - failed
            - cancelled
        phase:
          enum:
            - wait
            - install
            - verify
            - complete
          type: string
        previousVersion:
          type: string
          maxLength: 128
        release:
          anyOf:
            - $ref: "#/components/schemas/HostedRunnerRelease"
            - type: "null"
      required:
        - outcome
        - operationId
        - phase
        - release
        - previousVersion
        - healthy
      type: object
    HostedUpdaterPoll:
      additionalProperties: false
      properties:
        operationId:
          type: string
          maxLength: 36
        report:
          enum:
            - idle
            - verifying
            - health
            - rollback-health
            - succeeded
            - rolled_back
            - failed
          type: string
      required:
        - report
      type: object
      description:
        Polling idle without operationId selects the node’s durable active
        operation, if any. All non-idle reports require its operationId.
        Repeating a report cannot select or mutate another node’s operation.
