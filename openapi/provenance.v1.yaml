  schemas:
    StableId:
      type: string
      format: uuid
      description: Stable resource identifier.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with an explicit UTC offset.
    Slug:
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      minLength: 1
      maxLength: 63
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination or event continuation cursor.
    LogCursor:
      type: string
      minLength: 16
      maxLength: 1024
      pattern: ^[A-Za-z0-9._~-]+$
      description: Opaque, short-lived live-log relay position; clients must not parse it.
    BoundedStableId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      description: Canonical bounded UUID resource identifier.
    LogTimestamp:
      type: string
      format: date-time
      minLength: 20
      maxLength: 35
      description: Bounded RFC 3339 timestamp with an explicit UTC offset.
    LogSequence:
      type: string
      minLength: 1
      maxLength: 20
      pattern: ^(?:0|[1-9][0-9]{0,19})$
      description: Unsigned runner log sequence represented as decimal text without precision loss.
    DroppedLogCount:
      type: string
      minLength: 1
      maxLength: 20
      pattern: ^[1-9][0-9]{0,19}$
      description: Positive unsigned count represented as decimal text without precision loss.
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]{8,128}$
    Sha256Digest:
      type: string
      pattern: ^[a-f0-9]{64}$
    RunnerRegistrationToken:
      type: string
      minLength: 50
      maxLength: 50
      pattern: ^prr_v1_[A-Za-z0-9_-]{43}$
      description: >-
        Prefix `prr_v1_` followed by the unpadded base64url encoding of exactly
        32 cryptographically random bytes. The authority stores only SHA-256 of
        the complete token. Maximum lifetime is 900 seconds and consumption is
        one-time and atomic.
    RunnerConnectionCredential:
      type: string
      minLength: 50
      maxLength: 50
      pattern: ^prc_v1_[A-Za-z0-9_-]{43}$
      description: >-
        Prefix `prc_v1_` followed by the unpadded base64url encoding of exactly
        32 cryptographically random bytes. The authority stores only SHA-256 of
        the complete credential. It is bound to one runner and organization and
        expires no more than 3600 seconds after issuance.
    Ed25519PublicKey:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{43}$
      contentEncoding: base64url
      description: Unpadded base64url encoding of exactly 32 raw Ed25519 public-key bytes.
    Ed25519Signature:
      type: string
      minLength: 86
      maxLength: 86
      pattern: ^[A-Za-z0-9_-]{86}$
      contentEncoding: base64url
      description: Unpadded base64url encoding of exactly 64 raw Ed25519 signature bytes.
    PublicKeyFingerprint:
      type: string
      minLength: 71
      maxLength: 71
      pattern: ^sha256:[a-f0-9]{64}$
      description: SHA-256 of the exact 32 raw public-key bytes, lowercase hexadecimal.
    RegistrationTokenTtlSeconds:
      type: integer
      minimum: 60
      maximum: 900
      default: 900
      description: Requested one-time registration-token lifetime in seconds.
    RunnerCredentialTtlSeconds:
      type: integer
      minimum: 300
      maximum: 3600
      default: 900
      description: Requested connection-credential lifetime in seconds.
    RunnerCredentialOverlapSeconds:
      type: integer
      minimum: 30
      maximum: 300
      default: 120
      description: >-
        Requested predecessor overlap in seconds. It must be shorter than the
        requested credential lifetime.
    PageInfo:
      type: object
      additionalProperties: false
      required: [hasMore]
      properties:
        hasMore:
          type: boolean
        nextCursor:
          type: [string, "null"]
          minLength: 1
          maxLength: 2048
    ProblemDetails:
      type: object
      description: RFC 9457 problem details with stable Provenance extensions.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ProblemFieldError"
      additionalProperties: true
    ProblemFieldError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        path:
          type: string
        message:
          type: string
          minLength: 1
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
    PrivateProblemDetails:
      type: object
      description: Bounded RFC 9457 problem details for private log resources.
      additionalProperties: false
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          minLength: 1
          maxLength: 256
          default: about:blank
        title:
          type: string
          minLength: 1
          maxLength: 256
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 4096
        instance:
          type: string
          format: uri-reference
          maxLength: 512
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
        traceId:
          type: string
          minLength: 1
          maxLength: 128
        errors:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/PrivateProblemFieldError"
      x-provenance-max-json-bytes: 16384
    PrivateProblemFieldError:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        path:
          type: string
          maxLength: 512
        message:
          type: string
          minLength: 1
          maxLength: 1024
        code:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[a-z][a-z0-9_]*$
    AuthenticationRequiredProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: authentication_required
    PrivateLogNotFoundProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: private_log_not_found
    LogRequestInvalidProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              enum:
                - last_event_id_not_applicable
                - limit_not_applicable
                - log_cursor_conflict
                - invalid_log_cursor
    LogRepresentationNotAcceptableProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: log_representation_not_acceptable
    LogCursorExpiredProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
        - type: object
          required: [code]
          properties:
            code:
              type: string
              const: log_cursor_expired
    LogRateLimitedProblem:
      allOf:
        - $ref: "#/components/schemas/PrivateProblemDetails"
