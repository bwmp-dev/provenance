        - artifactId
        - configurationHash
        - version
        - state
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        projectId:
          $ref: "#/components/schemas/StableId"
        artifactId:
          $ref: "#/components/schemas/StableId"
        configurationHash:
          $ref: "#/components/schemas/Sha256Digest"
        version:
          type: string
        state:
          $ref: "#/components/schemas/ReleaseCandidateState"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    ReleaseEvent:
      type: object
      additionalProperties: false
      required: [id, candidateId, sequence, kind, occurredAt]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        candidateId:
          $ref: "#/components/schemas/StableId"
        sequence:
          type: integer
          minimum: 0
        kind:
          type: string
          enum:
            - created
            - testing_started
            - test_completed
            - approval_requested
            - approved
            - canceled
            - retry_requested
            - publication_started
            - publication_completed
            - failed
        occurredAt:
          $ref: "#/components/schemas/Timestamp"
    ReleaseEventPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ReleaseEvent"
        page:
          $ref: "#/components/schemas/PageInfo"
    Verification:
      type: object
      additionalProperties: false
      required: [id, candidateId, artifactSha256, state, trust, verifiedAt]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        candidateId:
          $ref: "#/components/schemas/StableId"
        artifactSha256:
          $ref: "#/components/schemas/Sha256Digest"
        state:
          $ref: "#/components/schemas/VerificationState"
        trust:
          type: string
          enum: [hosted, self_hosted]
        verifiedAt:
          $ref: "#/components/schemas/Timestamp"
    PublicRelease:
      type: object
      additionalProperties: false
      required:
        - ownerSlug
        - projectSlug
        - version
        - verification
        - claim
      properties:
        ownerSlug:
          $ref: "#/components/schemas/Slug"
        projectSlug:
          $ref: "#/components/schemas/Slug"
        version:
          type: string
        verification:
          $ref: "#/components/schemas/Verification"
        claim:
          type: string
          const: The exact artifact was observed passing the listed tests and environments.
    Integration:
      type: object
      additionalProperties: false
      required: [id, projectId, kind, displayName, state, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        projectId:
          $ref: "#/components/schemas/StableId"
        kind:
          type: string
          enum: [github_release, modrinth, hangar]
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        state:
          $ref: "#/components/schemas/IntegrationState"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CreateIntegrationRequest:
      type: object
      additionalProperties: false
      required: [kind, displayName]
      properties:
        kind:
          type: string
          enum: [github_release, modrinth, hangar]
        displayName:
          type: string
          minLength: 1
          maxLength: 128
    UpdateIntegrationRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        state:
          type: string
          enum: [active, disabled]
    IntegrationPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Integration"
        page:
          $ref: "#/components/schemas/PageInfo"
    Runner:
      type: object
      additionalProperties: false
      required: [id, organizationId, name, state, trust, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        organizationId:
          $ref: "#/components/schemas/StableId"
        name:
          type: string
          minLength: 1
          maxLength: 128
        state:
          $ref: "#/components/schemas/RunnerState"
        trust:
          type: string
          const: self_hosted
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    RunnerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Runner"
        page:
          $ref: "#/components/schemas/PageInfo"
    CreateRunnerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
    RunnerRegistration:
      type: object
      additionalProperties: false
      required: [runnerId, registrationToken, expiresAt]
      properties:
        runnerId:
          $ref: "#/components/schemas/StableId"
        registrationToken:
          type: string
          minLength: 1
          description: One-time runner registration token.
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    UpdateRunnerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
