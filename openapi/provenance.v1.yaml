        - installationId
        - repositoryId
        - repositoryFullName
        - createdAt
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        projectId:
          $ref: "#/components/schemas/StableId"
        installationId:
          $ref: "#/components/schemas/StableId"
        repositoryId:
          type: integer
          minimum: 1
        repositoryFullName:
          type: string
          pattern: ^[^/]+/[^/]+$
          maxLength: 512
        createdAt:
          $ref: "#/components/schemas/Timestamp"
    CreateGitHubConnectionRequest:
      type: object
      additionalProperties: false
      required: [projectId, installationId, repositoryId, repositoryFullName]
      properties:
        projectId:
          $ref: "#/components/schemas/StableId"
        installationId:
          $ref: "#/components/schemas/StableId"
        repositoryId:
          type: integer
          minimum: 1
        repositoryFullName:
          type: string
          pattern: ^[^/]+/[^/]+$
          maxLength: 512
    ArtifactUpload:
