      oneOf:
        - $ref: "#/components/schemas/CompleteLogPending"
        - $ref: "#/components/schemas/CompleteLogAvailable"
        - $ref: "#/components/schemas/CompleteLogFailed"
        - $ref: "#/components/schemas/CompleteLogExpired"
        - $ref: "#/components/schemas/CompleteLogUnavailable"
      discriminator:
        propertyName: state
        mapping:
          pending: "#/components/schemas/CompleteLogPending"
          available: "#/components/schemas/CompleteLogAvailable"
          failed: "#/components/schemas/CompleteLogFailed"
          expired: "#/components/schemas/CompleteLogExpired"
          unavailable: "#/components/schemas/CompleteLogUnavailable"
    CompleteLogPending:
      type: object
      additionalProperties: false
      required: [state, retryAfterSeconds]
