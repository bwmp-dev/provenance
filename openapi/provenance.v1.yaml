        - compressedSizeBytes
        - contentType
        - downloadPath
        - wasRedacted
        - wasTruncated
      properties:
        state:
          type: string
          const: available
        sha256:
          $ref: "#/components/schemas/Sha256Digest"
        compressedSizeBytes:
          type: integer
          minimum: 1
          maximum: 269484032
        uncompressedSizeBytes:
          type: integer
          minimum: 0
          maximum: 268435456
          description: Present only when exact uncompressed size evidence is available.
        contentType:
          type: string
          const: application/gzip
        downloadPath:
          type: string
          minLength: 110
          maxLength: 160
          pattern: ^/v1/release-candidates/[0-9a-f-]{36}/executions/[0-9a-f-]{36}/logs/complete$
          description: >-
            Same-origin authenticated API path with no query or fragment. It is
            not an object key, redirect, presigned URL, or durable capability.
        wasRedacted:
          type: boolean
        wasTruncated:
          type: boolean
        expiresAt:
          $ref: "#/components/schemas/LogTimestamp"
    CompleteLogFailed:
