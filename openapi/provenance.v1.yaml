            application/json:
              schema:
                $ref: "../schemas/key-discovery/v1/schema.json"
        "503":
          description: Public key snapshot unavailable.
          headers:
            Cache-Control:
              required: true
              schema: { type: string, const: no-store }
          content:
            application/problem+json:
              schema:
                type: object
                additionalProperties: false
                required: [type, title, status, code]
                properties:
                  type: { type: string, const: "about:blank" }
                  title: { type: string, const: "Public keys unavailable" }
                  status: { type: integer, const: 503 }
                  code: { type: string, const: public_keys_unavailable }
        default:
          $ref: "#/components/responses/Problem"
  /v1/admin/hosted-runners:
