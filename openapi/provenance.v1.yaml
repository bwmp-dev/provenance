        artifactId:
          $ref: "#/components/schemas/StableId"
        configurationHash:
          $ref: "#/components/schemas/Sha256Digest"
        version:
          type: string
          minLength: 1
          maxLength: 128
        changelog:
          type: string
          maxLength: 65536
    CandidateDecisionRequest:
      type: object
      additionalProperties: false
