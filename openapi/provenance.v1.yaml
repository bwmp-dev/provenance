    PublicationResult:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "version",
            "candidateId",
            "projectId",
            "generation",
            "artifactId",
            "artifactSha256",
            "configurationSnapshotId",
            "configurationSha256",
            "status",
            "composition",
          ],
        "properties":
          {
            "version": { "type": "integer", "const": 1 },
            "candidateId":
              { "type": "string", "format": "uuid", "maxLength": 36 },
            "projectId":
              { "type": "string", "format": "uuid", "maxLength": 36 },
            "generation":
              { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
            "artifactId":
              { "type": "string", "format": "uuid", "maxLength": 36 },
            "artifactSha256":
              {
                "type": "string",
                "pattern": "^[a-f0-9]{64}$",
                "minLength": 64,
                "maxLength": 64,
              },
            "configurationSnapshotId":
              { "type": "string", "format": "uuid", "maxLength": 36 },
            "configurationSha256":
              {
                "type": "string",
                "pattern": "^[a-f0-9]{64}$",
                "minLength": 64,
                "maxLength": 64,
              },
            "status":
              { "type": "string", "enum": ["not_admitted", "admitted"] },
            "composition":
              {
                "oneOf":
                  [
                    { "type": "null" },
                    {
                      "$ref": "#/components/schemas/PublicationCompositionResult",
                    },
                  ],
              },
          },
        "allOf":
          [
            {
              "if": { "properties": { "status": { "const": "not_admitted" } } },
              "then": { "properties": { "composition": { "type": "null" } } },
              "else":
                {
                  "properties":
                    {
                      "composition":
                        {
                          "$ref": "#/components/schemas/PublicationCompositionResult",
                        },
                    },
                },
            },
          ],
      }
    PublicationCompositionResult:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["id", "policy", "aggregate", "targets"],
        "properties":
          {
            "id": { "type": "string", "format": "uuid", "maxLength": 36 },
            "policy":
              { "$ref": "#/components/schemas/PublicationResultPolicy" },
            "aggregate":
              {
                "oneOf":
                  [
                    { "type": "null" },
                    {
                      "$ref": "#/components/schemas/PublicationAggregateDecision",
                    },
                  ],
              },
            "targets":
              {
                "type": "array",
                "minItems": 1,
                "maxItems": 4,
                "items":
                  { "$ref": "#/components/schemas/PublicationTargetResult" },
              },
          },
      }
    PublicationResultPolicy:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["primaryFailure", "secondaryFulfillment", "waiting"],
        "properties":
          {
            "primaryFailure":
              {
                "type": "string",
                "enum": ["stop_remaining", "continue_remaining"],
              },
            "secondaryFulfillment":
              {
                "type": "string",
                "enum": ["required_for_success", "informational"],
              },
            "waiting": { "type": "string", "enum": ["finite", "indefinite"] },
          },
      }
    PublicationAggregateDecision:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["outcome", "code", "decidedAt"],
        "properties":
          {
            "outcome":
              {
                "type": "string",
                "enum": ["succeeded", "failed", "requirement_unfulfilled"],
              },
            "code":
              {
                "type": "string",
                "enum":
                  [
                    "confirmed",
                    "primary_failed",
                    "dependency_blocked",
                    "budget_exhausted",
                  ],
              },
            "decidedAt": { "$ref": "#/components/schemas/BoundedTimestamp" },
          },
        "allOf":
          [
            {
              "if": { "properties": { "outcome": { "const": "succeeded" } } },
              "then": { "properties": { "code": { "const": "confirmed" } } },
            },
            {
              "if": { "properties": { "outcome": { "const": "failed" } } },
              "then":
                { "properties": { "code": { "const": "primary_failed" } } },
            },
            {
              "if":
                {
                  "properties":
                    { "outcome": { "const": "requirement_unfulfilled" } },
                },
              "then":
                {
                  "properties":
                    {
                      "code":
                        { "enum": ["dependency_blocked", "budget_exhausted"] },
                    },
                },
            },
          ],
      }
    PublicationTargetResult:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "identifier",
            "type",
            "disposition",
            "providerState",
            "remoteKnowledge",
            "requiredPrimaryTargets",
          ],
        "properties":
          {
            "identifier":
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 63,
                "pattern": "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$",
              },
            "type":
              {
                "type": "string",
                "enum": ["github", "modrinth", "hangar", "discord"],
              },
            "disposition":
              {
                "type": "string",
                "enum":
                  [
                    "pending",
                    "active",
                    "succeeded",
                    "failed",
                    "skipped",
                    "dependency_blocked",
                    "budget_exhausted",
                  ],
              },
            "providerState":
              {
                "type": ["string", "null"],
                "enum":
                  [
                    null,
                    "pending",
                    "preflight",
                    "uploading",
                    "publishing",
                    "retryable",
                    "succeeded",
                    "permanent",
                    "conflict",
                    "active",
                  ],
              },
            "remoteKnowledge":
              {
                "type": "string",
                "enum":
                  [
                    "not_observed",
                    "uncertain",
                    "known",
                    "confirmed",
                    "conflict",
                  ],
              },
            "requiredPrimaryTargets":
              {
                "type": "array",
                "maxItems": 3,
                "uniqueItems": true,
                "items":
                  {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 63,
                    "pattern": "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$",
                  },
              },
          },
        "allOf":
          [
            {
              "if": { "properties": { "type": { "const": "discord" } } },
              "then":
                {
                  "properties":
                    {
                      "providerState":
                        {
                          "enum":
                            [
                              null,
                              "pending",
                              "active",
                              "retryable",
                              "succeeded",
                            ],
                        },
                      "disposition":
                        {
                          "enum":
                            [
                              "pending",
                              "active",
                              "succeeded",
                              "dependency_blocked",
                              "budget_exhausted",
                            ],
                        },
                      "remoteKnowledge":
                        {
                          "enum":
                            ["not_observed", "uncertain", "known", "confirmed"],
                        },
                      "requiredPrimaryTargets": { "minItems": 1 },
                    },
                },
              "else":
                {
                  "properties":
                    {
                      "providerState":
                        {
                          "enum":
                            [
                              null,
                              "pending",
                              "preflight",
                              "uploading",
                              "publishing",
                              "retryable",
                              "succeeded",
                              "permanent",
                              "conflict",
                            ],
                        },
                      "disposition":
                        {
                          "enum":
                            [
                              "pending",
                              "active",
                              "succeeded",
                              "failed",
                              "skipped",
                            ],
                        },
                      "remoteKnowledge":
                        {
                          "enum":
                            [
                              "not_observed",
                              "uncertain",
                              "confirmed",
                              "conflict",
                            ],
                        },
                      "requiredPrimaryTargets": { "maxItems": 0 },
                    },
                },
            },
            {
              "if": { "properties": { "providerState": { "type": "null" } } },
              "then":
                {
                  "properties":
                    { "remoteKnowledge": { "const": "not_observed" } },
                },
            },
            {
              "if":
                { "properties": { "providerState": { "const": "succeeded" } } },
              "then":
                {
                  "properties": { "remoteKnowledge": { "const": "confirmed" } },
                },
            },
            {
              "if":
                { "properties": { "providerState": { "const": "conflict" } } },
              "then":
                {
                  "properties": { "remoteKnowledge": { "const": "conflict" } },
                },
            },
          ],
      }
    PublicationResultProblem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          const: about:blank
        title:
          type: string
          enum:
            - Invalid publication result request
            - Authentication required
            - Forbidden
            - Not found
            - Publication result unavailable
            - Method not allowed
            - Request too large
            - Too many requests
            - Internal server error
        status:
          type: integer
          enum:
            - 400
            - 401
            - 403
            - 404
            - 503
            - 405
            - 413
            - 429
            - 500
        code:
          type: string
          enum:
            - invalid_request
            - unauthorized
            - forbidden
            - not_found
            - publication_result_unavailable
            - method_not_allowed
            - request_too_large
            - rate_limited
            - internal_error
      allOf:
        - if:
            properties:
              code:
                const: invalid_request
          then:
            properties:
              status:
                const: 400
              title:
                const: Invalid publication result request
        - if:
            properties:
              code:
                const: unauthorized
          then:
            properties:
              status:
                const: 401
              title:
                const: Authentication required
        - if:
            properties:
              code:
                const: forbidden
          then:
            properties:
              status:
                const: 403
              title:
                const: Forbidden
        - if:
            properties:
              code:
                const: not_found
          then:
            properties:
              status:
                const: 404
              title:
                const: Not found
        - if:
            properties:
              code:
                const: publication_result_unavailable
          then:
            properties:
              status:
                const: 503
              title:
                const: Publication result unavailable
        - if:
            properties:
              code:
                const: method_not_allowed
          then:
            properties:
              status:
                const: 405
              title:
                const: Method not allowed
        - if:
            properties:
              code:
                const: request_too_large
          then:
            properties:
              status:
                const: 413
              title:
                const: Request too large
        - if:
            properties:
              code:
                const: rate_limited
          then:
            properties:
              status:
                const: 429
              title:
                const: Too many requests
        - if:
            properties:
              code:
                const: internal_error
          then:
            properties:
              status:
                const: 500
              title:
                const: Internal server error
    DeviceLoginSecret:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      description: Canonical unpadded base64url encoding of 32 cryptographically
        random bytes.
    DeviceLoginUserCode:
      type: string
      minLength: 9
      maxLength: 9
      pattern: "^[A-HJ-NP-Z2-9]{4}-[A-HJ-NP-Z2-9]{4}$"
      description:
        Unpredictable confirmation code; not a redemption credential. Exact
        uppercase spelling, no normalization.
    DeviceLoginInterval:
      type: integer
      minimum: 1
      maximum: 86400
    DeviceLoginDecisionRequest:
      type: object
      additionalProperties: false
      required: [userCode, decision]
      properties:
        userCode:
          $ref: "#/components/schemas/DeviceLoginUserCode"
        decision:
          type: string
          enum: [approve, deny]
    DeviceLoginDecision:
      type: object
      additionalProperties: false
      required: [state, expiresAt]
      properties:
        state:
          type: string
          enum: [approved, denied]
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    DeviceLoginExchangeRequest:
      type: object
      additionalProperties: false
      required: [deviceCode]
      properties:
        deviceCode:
          $ref: "#/components/schemas/DeviceLoginSecret"
    DeviceLoginPending:
      type: object
      additionalProperties: false
      required: [state, intervalSeconds, expiresAt]
      properties:
        state:
          type: string
          const: pending
        intervalSeconds:
          $ref: "#/components/schemas/DeviceLoginInterval"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    DeviceLoginExchange:
      type: object
      additionalProperties: false
      required: [exchangeToken, expiresAt]
      properties:
        exchangeToken:
          $ref: "#/components/schemas/DeviceLoginSecret"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    GitHubProviderId:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description:
        Positive exact JSON safe integer supplied by GitHub, not a platform
        StableId.
    CreateGitHubDiscoveryAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          projectId,
          redirectUri,
          codeChallenge,
          codeChallengeMethod,
        ]
      properties:
        organizationId:
          $ref: "#/components/schemas/BoundedStableId"
        projectId:
          $ref: "#/components/schemas/BoundedStableId"
        redirectUri:
          $ref:
            "#/components/schemas/CreateGitHubAuthorizationRequest/properties/redirec\
            tUri"
        codeChallenge:
          $ref:
            "#/components/schemas/CreateGitHubAuthorizationRequest/properties/codeCha\
            llenge"
        codeChallengeMethod:
          $ref:
            "#/components/schemas/CreateGitHubAuthorizationRequest/properties/codeCha\
            llengeMethod"
    CreateGitHubConnectionAuthorizationRequest:
      type: object
      additionalProperties: false
      required:
        [
          organizationId,
          projectId,
          redirectUri,
          codeChallenge,
          codeChallengeMethod,
          githubInstallationId,
          githubRepositoryId,
          repositoryFullName,
        ]
      properties:
        organizationId:
          $ref: "#/components/schemas/BoundedStableId"
        projectId:
          $ref: "#/components/schemas/BoundedStableId"
        redirectUri:
          $ref:
            "#/components/schemas/CreateGitHubAuthorizationRequest/properties/redirec\
            tUri"
        codeChallenge:
          $ref:
            "#/components/schemas/CreateGitHubAuthorizationRequest/properties/codeCha\
            llenge"
        codeChallengeMethod:
          $ref:
            "#/components/schemas/CreateGitHubAuthorizationRequest/properties/codeCha\
            llengeMethod"
        githubInstallationId:
          $ref: "#/components/schemas/GitHubProviderId"
        githubRepositoryId:
          $ref: "#/components/schemas/GitHubProviderId"
        repositoryFullName:
          $ref:
            "#/components/schemas/CreateGitHubConnectionRequest/properties/repository\
            FullName"
    GitHubDiscoverySnapshot:
      type: object
      additionalProperties: false
      required: [snapshotId, expiresAt]
      properties:
        snapshotId:
          $ref: "#/components/schemas/GitHubAuthorizationOpaque32"
        expiresAt:
          $ref: "#/components/schemas/BoundedTimestamp"
          description:
            Fixed finite snapshot expiry, no later than the configured flow
            deadline; never extended by reads or replay.
    GitHubDiscoveryRepository:
      type: object
      additionalProperties: false
      description:
        Private immutable observations, never proof authorizing a later
        connection. All IDs are provider IDs.
      required:
        [
          githubInstallationId,
          githubAccountId,
          githubRepositoryId,
          accountType,
          accountLogin,
          repositoryName,
          repositoryFullName,
          isPrivate,
        ]
      properties:
        githubInstallationId:
          $ref: "#/components/schemas/GitHubProviderId"
        githubAccountId:
          $ref: "#/components/schemas/GitHubProviderId"
        githubRepositoryId:
          $ref: "#/components/schemas/GitHubProviderId"
        accountType:
          type: string
          enum: [User, Organization]
        accountLogin:
          type: string
          minLength: 1
          maxLength: 255
        repositoryName:
          type: string
          minLength: 1
          maxLength: 255
        repositoryFullName:
          $ref:
            "#/components/schemas/CreateGitHubConnectionRequest/properties/repository\
            FullName"
        isPrivate:
          type: boolean
    GitHubDiscoveryPageInfo:
      allOf:
        - $ref: "#/components/schemas/PageInfo"
        - oneOf:
            - type: object
              required: [hasMore, nextCursor]
              properties:
                hasMore:
                  const: true
                nextCursor:
                  $ref: "#/components/schemas/Cursor"
            - type: object
              required: [hasMore]
              properties:
                hasMore:
                  const: false
                nextCursor:
                  type: "null"
    GitHubDiscoveryRepositoryPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          maxItems: 100
          uniqueItems: true
          items:
            $ref: "#/components/schemas/GitHubDiscoveryRepository"
        page:
          $ref: "#/components/schemas/GitHubDiscoveryPageInfo"
    GitHubAuthorizationOpaque32:
      type: string
      minLength: 43
      maxLength: 43
      pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
      description: Canonical unpadded base64url encoding of exactly 32 bytes,
        including zero unused pad bits.
    CreateGitHubAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [redirectUri, codeChallenge, codeChallengeMethod]
      properties:
        redirectUri:
          type: string
          format: uri
          maxLength: 2048
          pattern: '^https://[^/@?#\s]+(?:/[^#\s]*)?$'
          description:
            Exact configured allowlisted HTTPS callback URI; no userinfo or
            fragment. URI parsing and allowlist checks are required in addition
            to schema validation.
        codeChallenge:
          $ref: "#/components/schemas/GitHubAuthorizationOpaque32"
        codeChallengeMethod:
          type: string
          const: S256
    GitHubAuthorization:
      type: object
      additionalProperties: false
      required: [authorizationId, state, providerUrl, expiresAt]
      properties:
        authorizationId:
          $ref: "#/components/schemas/GitHubAuthorizationOpaque32"
        state:
          $ref: "#/components/schemas/GitHubAuthorizationOpaque32"
          description:
            Independently generated random state; bind server-side to the
            initiating browser session.
        providerUrl:
          type: string
          format: uri
          maxLength: 8192
          pattern: '^https://github\.com/login/oauth/authorize\?[^#\s]+$'
          description:
            Server-constructed URL containing only the configured client ID and
            frozen authorization parameters. Sensitive state; never log or
            expose to telemetry.
        expiresAt:
          $ref: "#/components/schemas/BoundedTimestamp"
          description:
            Immutable finite authorization expiry from required server
            configuration.
    CompleteGitHubAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [state, code, codeVerifier]
      properties:
        state:
          $ref: "#/components/schemas/GitHubAuthorizationOpaque32"
          writeOnly: true
        code:
          type: string
          minLength: 1
          maxLength: 4096
          pattern: '^[^\x00-\x1F\x7F-\x9F]+$'
          writeOnly: true
          description:
            Opaque GitHub authorization code. This is an API resource bound,
            not an upstream format guarantee.
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]{43,128}$"
          writeOnly: true
    GitHubAuthorizationCompletion:
      type: object
      additionalProperties: false
      required: [exchangeToken, expiresAt]
      properties:
        exchangeToken:
          type: string
          minLength: 1
          maxLength: 4096
          description:
            Opaque one-time platform credential, server-only and shown once.
            Store only its hash. Not a GitHub token or raw authorization code.
        expiresAt:
          $ref: "#/components/schemas/BoundedTimestamp"
          description:
            Immutable finite exchange-token expiry from required server
            configuration.
    StableId:
      type: string
      format: uuid
      description: Stable resource identifier.
    CanonicalStableId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      description: Canonical lowercase UUID resource identifier.
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with an explicit UTC offset.
    BoundedTimestamp:
      allOf:
        - $ref: "#/components/schemas/Timestamp"
      maxLength: 35
      description: Bounded RFC 3339 timestamp with an explicit UTC offset.
    Slug:
      type: string
      pattern: ^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$
      minLength: 1
      maxLength: 63
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      description: Opaque pagination or event continuation cursor.
    LogCursor:
      type: string
      minLength: 16
      maxLength: 1024
      pattern: ^[A-Za-z0-9._~-]+$
      description: Opaque, short-lived live-log relay position; clients must not parse it.
    BoundedStableId:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      description: Canonical bounded UUID resource identifier.
    LogTimestamp:
      type: string
      format: date-time
      minLength: 20
      maxLength: 35
      description: Bounded RFC 3339 timestamp with an explicit UTC offset.
    LogSequence:
      type: string
      minLength: 1
      maxLength: 20
      pattern: ^(?:0|[1-9][0-9]{0,19})$
      description:
        Unsigned runner log sequence represented as decimal text without
        precision loss.
    DroppedLogCount:
      type: string
      minLength: 1
      maxLength: 20
      pattern: ^[1-9][0-9]{0,19}$
      description: Positive unsigned count represented as decimal text without
        precision loss.
    IdempotencyKey:
      type: string
      minLength: 8
      maxLength: 128
      pattern: ^[A-Za-z0-9._:-]{8,128}$
    Sha256Digest:
      type: string
      pattern: ^[a-f0-9]{64}$
    RunnerRegistrationToken:
      type: string
      minLength: 50
      maxLength: 50
      pattern: ^prr_v1_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
      description: >-
        Prefix `prr_v1_` followed by the unpadded base64url encoding of exactly
        32 cryptographically random bytes. The final character constrains the
        unused pad bits to zero; decoders must reject any value that does not
        decode and re-encode byte-for-byte to the submitted spelling. The
        authority stores only SHA-256 of the complete token. Maximum lifetime is
        900 seconds and consumption is one-time and atomic.
    RunnerConnectionCredential:
      type: string
      minLength: 50
      maxLength: 50
      pattern: ^prc_v1_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
      description: >-
        Prefix `prc_v1_` followed by the unpadded base64url encoding of exactly
        32 cryptographically random bytes with canonical zero pad bits. A
        decoder must reject any value whose decode-and-unpadded-base64url-
        re-encode differs from the submitted spelling. The authority stores only
        SHA-256 of the complete credential. It is bound to one runner and
        organization and expires no more than 3600 seconds after issuance.
    Ed25519PublicKey:
      type: string
      minLength: 43
      maxLength: 43
      pattern: ^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
      contentEncoding: base64url
      description: >-
        Canonical unpadded base64url encoding of exactly 32 raw Ed25519
        public-key bytes. The final character has zero pad bits. The server must
        reject an encoding unless decoding and canonical re-encoding reproduces
        the submitted text exactly.
    Ed25519Signature:
      type: string
      minLength: 86
      maxLength: 86
      pattern: ^[A-Za-z0-9_-]{85}[AQgw]$
      contentEncoding: base64url
      description: >-
        Canonical unpadded base64url encoding of exactly 64 raw Ed25519
        signature bytes. The final character has zero pad bits. The server must
        reject an encoding unless decoding and canonical re-encoding reproduces
        the submitted text exactly.
    PublicKeyFingerprint:
      type: string
      minLength: 71
      maxLength: 71
      pattern: ^sha256:[a-f0-9]{64}$
      description: SHA-256 of the exact 32 raw public-key bytes, lowercase hexadecimal.
    RegistrationTokenTtlSeconds:
      type: integer
      minimum: 60
      maximum: 900
      default: 900
      description: Requested one-time registration-token lifetime in seconds.
    RunnerCredentialTtlSeconds:
      type: integer
      minimum: 300
      maximum: 3600
      default: 900
      description: Requested connection-credential lifetime in seconds.
    RunnerCredentialOverlapSeconds:
      type: integer
      minimum: 30
      maximum: 300
      default: 120
      description: >-
        Requested predecessor overlap in seconds. It must be shorter than the
        requested credential lifetime.
