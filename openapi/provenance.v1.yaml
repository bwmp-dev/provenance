        - publicationAttempts
      properties:
        organizationId:
          $ref: "#/components/schemas/StableId"
        from:
          $ref: "#/components/schemas/Timestamp"
        to:
          $ref: "#/components/schemas/Timestamp"
        runnerWallSeconds:
          type: integer
          minimum: 0
        allocatedCpuSeconds:
          type: number
          minimum: 0
        allocatedMemoryByteSeconds:
          type: integer
          minimum: 0
        artifactBytes:
          type: integer
          minimum: 0
        logBytes:
          type: integer
          minimum: 0
        egressBytes:
          type: integer
          minimum: 0
        matrixExecutions:
          type: integer
          minimum: 0
        publicationAttempts:
          type: integer
          minimum: 0
