    RunnerState:
      type: string
      enum: [offline, idle, busy, draining]
      description: >-
        Released connectivity and scheduling state. Credential lifecycle is
        represented separately so this closed alpha.5 response enum remains
        wire-compatible.
    RunnerCredentialLifecycleState:
      type: string
      enum: [registering, active, quarantined, revoked]
      description: >-
        `registering` has an unconsumed enrollment token and no credential;
        `active` has a current credential and may be offline, idle, busy, or
        draining; `quarantined` rejects every credential and job until an
        authorized recovery clears quarantine; `revoked` is terminal and rejects
        registration tokens, current/predecessor credentials, and streams while
        retaining audit identity. A registering, quarantined, or revoked runner
        reports released RunnerState `offline` alongside this field so alpha.5
        clients never receive a new RunnerState value.
