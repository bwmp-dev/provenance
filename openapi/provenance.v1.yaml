    CompleteArtifactUploadRequest:
      type: object
      additionalProperties: false
      required: [sizeBytes, sha256]
      properties:
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          $ref: "#/components/schemas/Sha256Digest"
    Artifact:
      type: object
      additionalProperties: false
      required:
        [
          id,
          projectId,
          fileName,
          sizeBytes,
          sha256,
          state,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        projectId:
          $ref: "#/components/schemas/StableId"
        fileName:
          type: string
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          $ref: "#/components/schemas/Sha256Digest"
        state:
          $ref: "#/components/schemas/ArtifactState"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    CreateReleaseCandidateRequest:
