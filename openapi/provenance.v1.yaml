        default:
          $ref: "#/components/responses/Problem"
  /v1/runners/{runnerId}/registration-redemptions:
    parameters:
      - $ref: "#/components/parameters/RunnerId"
    post:
      operationId: redeemRunnerRegistration
      summary: Redeem a one-time registration using an Ed25519 possession proof
      description: |
        Atomically validates and consumes the registration token, binds the
        runner-generated Ed25519 public key, and issues one short-lived
        organization-scoped connection credential. The token authenticates
        only its bound runner and organization; it grants no other API access.

        The signed UTF-8 message is exactly the following ASCII template,
        including field order, lowercase names, LF separators, and the final
        LF. UUID values use canonical lowercase form, the token hash is the
        lowercase hexadecimal SHA-256 of the complete registration token, and
        the public key is unpadded base64url of the exact 32 raw Ed25519 bytes:

        ```text
        provenance.runner.registration.v1
        organization_id:{organization_id}
        runner_id:{runner_id}
        registration_token_sha256:{registration_token_sha256}
        public_key_base64url:{public_key_base64url}
        ```

        Normative vector: organization
        `00000000-0000-0000-0000-000000000011`, runner
        `50000000-0000-0000-0000-000000000011`, token
        `prr_v1_AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8`, token
        SHA-256
        `227d5c86d147a519fa4caf435bb5cc85acbc20f709b94af9371122eaa6e6bbf9`,
        public key
        `11qYAYKxCrfVS_7TyWQHOg7hcvPapiMlrwIaaPcHURo`, and signature
        `gfTLqWihY048vNn-hZvs81xk7pmEdsM2WmCPGimPDrOoU8Gl1YW5BFg5lsh4ZYZiAGlv3XUzoH5oholxRcVDAQ`.

        Token consumption, key binding, credential hash persistence, and the
        successful idempotency record are one transaction. Invalid tokens and
        runner/path mismatches return the same response and do not disclose a
        runner or tenant. The raw token, credential, and private key are never
        stored by the authority.
      tags: [runners]
      security:
        - RunnerRegistrationToken: []
      parameters:
        - $ref: "#/components/parameters/SecretCreationIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RedeemRunnerRegistration"
      responses:
        "201":
          description: Registration consumed and connection credential issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerRegistrationRedemption"
        "401":
          $ref: "#/components/responses/RegistrationTokenInvalid"
        "409":
          $ref: "#/components/responses/RegistrationRedemptionConflict"
        "410":
          $ref: "#/components/responses/RegistrationTokenExpired"
        "422":
          $ref: "#/components/responses/RegistrationProofInvalid"
        default:
          $ref: "#/components/responses/Problem"
  /v1/runners/{runnerId}:
    parameters:
      - $ref: "#/components/parameters/RunnerId"
    get:
      operationId: getRunner
      summary: Read a self-hosted runner
      tags: [runners]
      responses:
        "200":
          description: Runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateRunner
      summary: Update runner administrative state
      tags: [runners]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/UpdateRunner"
      responses:
        "200":
          description: Updated runner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Runner"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/runners/{runnerId}/credentials/rotate:
    parameters:
      - $ref: "#/components/parameters/RunnerId"
    post:
      operationId: rotateRunnerCredentials
      summary: Rotate short-lived runner connection credentials
      description: |
        Issues a new credential for delivery through the feature-gated runner
        stream. The credential authority stores only its SHA-256 hash and audit
        identity. A separate delivery queue may retain only an encrypted,
        access-controlled envelope until acknowledgement, successful reconnect,
        or the predecessor deadline; it is unavailable to HTTP replay and is
        then erased. The old credential remains valid only for the bounded
        overlap returned by the runner protocol; a successful reconnect with
        the new credential revokes its predecessor immediately.
      tags: [runners]
      parameters:
        - $ref: "#/components/parameters/SecretCreationIdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RotateRunnerCredential"
      responses:
        "200":
          description: Rotated runner credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerCredential"
        "409":
          $ref: "#/components/responses/CredentialIssuanceConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/runners/{runnerId}/credential-revocations:
    parameters:
      - $ref: "#/components/parameters/RunnerId"
    post:
      operationId: revokeRunnerCredentials
      summary: Revoke a self-hosted runner and all of its credentials
      description: |
        Atomically revokes current and predecessor credentials, invalidates any
        unused registration token, terminates active streams, and places the
        runner in the terminal `revoked` state. Audit identities, credential
        fingerprints, timestamps, and the operator reason are retained; secret
        values are not. An unauthorized runner and a nonexistent runner use the
        same response so tenant membership is not disclosed.
      tags: [runners]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RevokeRunnerCredentials"
      responses:
        "201":
          description: Runner credential revocation recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunnerCredentialRevocation"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        default:
          $ref: "#/components/responses/Problem"
  /v1/organizations/{organizationId}/usage:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      operationId: getOrganizationUsage
      summary: Read organization usage for a bounded time range
      tags: [usage]
      parameters:
        - $ref: "#/components/parameters/UsageFrom"
        - $ref: "#/components/parameters/UsageTo"
      responses:
        "200":
          description: Organization usage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usage"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Capability- and tenant-scoped access token.
    SessionCookie:
      type: apiKey
      in: cookie
      name: provenance_session
      description: Secure browser session cookie.
    GitHubWebhookSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: GitHub HMAC-SHA256 webhook signature.
    RunnerRegistrationToken:
      type: http
      scheme: bearer
      bearerFormat: prr_v1
      description: >-
        One-time, runner-bound registration token. It authenticates only the
        registration-redemption operation and is atomically consumed there.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to the authenticated identity, HTTP method,
        and route. Repeating the same key and request returns the original
        outcome; reusing it with a different request conflicts.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    SessionCreationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to browser session creation. Reusing the
        key with a different request conflicts. After a request succeeds, the
        platform retains only a hash of the issued credential and cannot
        reproduce the original Set-Cookie value. Replaying that same request
        therefore fails closed with HTTP 409 and code
        `credential_not_replayable`; the caller must obtain a new one-time
        exchange token and use a new idempotency key.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    SecretCreationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Caller-generated key scoped to the authenticated identity, HTTP method,
        and route. Reuse with a different request returns
        `idempotency_key_conflict`. After a successful response containing a
        registration token or connection credential, the authority retains
        only the secret hash and cannot reproduce the plaintext. An identical
        retry therefore returns HTTP 409 `credential_not_replayable`, never a
        replacement secret; recovery requires a new authorized request and a
        new idempotency key.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional caller key. GitHub webhook delivery identity remains anchored
        by the required X-GitHub-Delivery header.
      schema:
        $ref: "#/components/schemas/IdempotencyKey"
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation cursor returned by the preceding page.
      schema:
        $ref: "#/components/schemas/Cursor"
    PageSize:
      name: limit
      in: query
      required: false
      description: Maximum number of resources to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Opaque release-event reconnect cursor.
      schema:
        $ref: "#/components/schemas/Cursor"
    LogCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque, short-lived live-relay position scoped to the authenticated
        tenant, candidate, execution, and attempt. It resumes strictly after the
        identified event and never promises durable replay.
      schema:
        $ref: "#/components/schemas/LogCursor"
    LogPageSize:
      name: limit
      in: query
      required: false
      description: >-
        Maximum number of ExecutionLogEvent values in a JSON reconciliation
        page, including gap and state events. It is invalid for SSE.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    LogLastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: >-
        SSE reconnect cursor. When both cursor forms are present they must be
        byte-for-byte equal. Any Last-Event-ID is invalid for JSON, and every SSE
        reconnect independently reauthorizes and validates the selected cursor.
      schema:
        $ref: "#/components/schemas/LogCursor"
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/BoundedStableId"
    VerificationId:
      name: verificationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    IntegrationId:
      name: integrationId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    RunnerId:
      name: runnerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/StableId"
    OwnerSlug:
      name: ownerSlug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    ProjectSlug:
      name: projectSlug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    Version:
      name: version
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    GitHubDeliveryId:
      name: X-GitHub-Delivery
      in: header
      required: true
      schema:
        type: string
        format: uuid
    GitHubEvent:
      name: X-GitHub-Event
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    UsageFrom:
      name: from
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
    UsageTo:
      name: to
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/Timestamp"
  headers:
    SessionCookie:
      description: HttpOnly, Secure browser session cookie.
      schema:
        type: string
    PrivateNoStore:
      required: true
      description: Private log responses must not be stored by shared or browser caches.
      schema:
        type: string
        const: private, no-store
    VaryAccept:
      required: true
      description: Content negotiation varies the representation by Accept.
      schema:
        type: string
        const: Accept
    BearerChallenge:
      required: true
      description: Bounded RFC 9110 Bearer authentication challenge.
      schema:
        type: string
        minLength: 25
        maxLength: 25
        const: Bearer realm="provenance"
    RetryAfter:
      required: true
      description: Bounded delay in seconds before retrying.
      schema:
        type: integer
        minimum: 1
        maximum: 60
    CompleteLogContentDigest:
      required: true
      description: RFC 9530 SHA-256 digest of the exact compressed response bytes.
      schema:
        type: string
        minLength: 54
        maxLength: 54
        pattern: ^sha-256=:[A-Za-z0-9+/]{43}=:$
    CompleteLogContentLength:
      required: true
      description: Exact compressed response size in bytes.
      schema:
        type: integer
        minimum: 1
        maximum: 269484032
    CompleteLogContentDisposition:
      required: true
      description: Bounded attachment filename; it never contains a storage object key.
      schema:
        type: string
        minLength: 29
        maxLength: 96
        pattern: ^attachment; filename="execution-[0-9a-f-]{36}\.log\.gz"$
  responses:
    NoContent:
      description: Mutation completed successfully.
    Problem:
      description: Request failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    PrivateProblem:
      description: Private request failed without a more specific response.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PrivateProblemDetails"
    AuthenticationRequired:
      description: Authentication is required; no private resource identity is disclosed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        WWW-Authenticate:
          $ref: "#/components/headers/BearerChallenge"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/AuthenticationRequiredProblem"
    PrivateLogNotFound:
      description: >-
        The private candidate or execution does not exist or the authenticated
        principal is not authorized to access it. Both cases use the identical
        status and problem shape to avoid cross-tenant identity disclosure.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/PrivateLogNotFoundProblem"
    LogRequestInvalid:
      description: >-
        A representation-specific parameter is not applicable, cursor forms
        conflict, or the selected cursor is invalid. Stable codes are
        `last_event_id_not_applicable`, `limit_not_applicable`,
        `log_cursor_conflict`, and `invalid_log_cursor`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogRequestInvalidProblem"
    LogRepresentationNotAcceptable:
      description: >-
        Accept does not permit application/json or text/event-stream. Code
        `log_representation_not_acceptable` is returned.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogRepresentationNotAcceptableProblem"
    LogCursorExpired:
      description: >-
        The valid, correctly scoped live cursor passed its short retention
        boundary. Code `log_cursor_expired` is returned. This is distinct from an
        accepted cursor whose position predates retained relay bytes, which
        returns HTTP 200 with a `log-gap` event.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogCursorExpiredProblem"
    LogRateLimited:
      description: The authenticated identity or relay subscriber limit was reached.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogRateLimitedProblem"
    LogRelayUnavailable:
      description: >-
        The best-effort live relay is unavailable. The client must reconcile
        execution state and complete-log status; this is not evidence that the
        execution or authoritative completed log failed.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/LogRelayUnavailableProblem"
    CompleteLogNotReady:
      description: >-
        Terminal complete-log verification or durable metadata persistence is
        still pending. Code `complete_log_not_ready` is returned.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CompleteLogNotReadyProblem"
    CompleteLogUnavailable:
      description: >-
        The complete log failed verification/persistence or was not produced.
        Code `complete_log_unavailable` is returned; structured result evidence
        remains a separate resource.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CompleteLogUnavailableProblem"
    CompleteLogExpired:
      description: >-
        The private complete log passed its retention boundary and is no longer
        downloadable. Code `complete_log_expired` is returned.
      headers:
        Cache-Control:
          $ref: "#/components/headers/PrivateNoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/CompleteLogExpiredProblem"
    IdempotencyConflict:
      description: The idempotency key was reused with a different request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    CredentialIssuanceConflict:
      description: |
        Secret issuance encountered an idempotency conflict. Reuse of an
        idempotency key with a different normalized request returns
        `idempotency_key_conflict`.

        An identical retry after successful registration-token or connection-
        credential issuance returns `credential_not_replayable`. Because the
        authority stores only a SHA-256 secret hash, it never returns the prior
        plaintext and never mints a replacement credential for that replay.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RegistrationTokenInvalid:
      description: >-
        The registration token is invalid, is bound to another runner, or does
        not authorize this request. All cases use HTTP 401 and code
        `registration_token_invalid` without disclosing runner or tenant
        identity.
      headers:
        WWW-Authenticate:
          description: Registration-token Bearer challenge.
          schema:
            type: string
            const: Bearer realm="runner-registration", error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RegistrationTokenExpired:
      description: >-
        The authenticated one-time token expired before atomic consumption.
        Returns HTTP 410 and code `registration_token_expired`; no credential is
        issued and the runner remains registering.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RegistrationProofInvalid:
      description: >-
        The public key or Ed25519 possession proof is malformed or does not
        verify over the exact domain-separated message. Returns HTTP 422 and
        code `registration_proof_invalid`; token consumption and key binding do
        not occur.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    RegistrationRedemptionConflict:
      description: |
        Registration redemption conflicted with durable state. A token already
        consumed by another request returns `registration_token_consumed`; a
        runner already bound to different key material returns
        `runner_key_conflict`; reuse of an idempotency key with a different
        request returns `idempotency_key_conflict`.

        If the same request committed and its plaintext credential response was
        lost, an identical retry returns `credential_not_replayable`. The
        authority stores only its hash and does not mint a replacement. Every
        conflict is HTTP 409 and leaves the committed binding unchanged.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    SessionCreationConflict:
      description: |
        Browser session creation encountered an idempotency conflict. Reusing
        the key with a different request returns code
        `idempotency_key_conflict`.

        Replaying the same request after its session credential was issued
        returns code `credential_not_replayable`, because the hash-only session
        store cannot reproduce the original Set-Cookie credential. The server
        does not mint a replacement credential for that replay. The caller must
        obtain a new one-time exchange token and use a new idempotency key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    ReleaseCandidateConflict:
      description: |
        Release candidate creation conflicted with an existing resource or
        idempotency record. Reusing an idempotency key with a different request
        returns code `idempotency_key_conflict`.

        When `configurationSnapshotId` is present, the identified snapshot must
        exist in the path project and its `configurationHash` must equal the
        request value. A missing ID returns `configuration_snapshot_not_found`;
        a project or hash mismatch returns `configuration_snapshot_mismatch`.

        When `configurationSnapshotId` is absent, exactly one snapshot in the
        path project must match `configurationHash`. Zero matches return
        `configuration_snapshot_not_found`; multiple matches return
        `configuration_snapshot_ambiguous`. All listed conflicts use HTTP 409.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
