  /.well-known/provenance-keys.json:
    get:
      operationId: getProvenanceKeys
      summary: Read the complete public attestation key snapshot
      description: >-
        Public-only discovery, not trust bootstrap or revocation. Match key IDs
        exactly; never fetch envelope-supplied URLs. Retired keys remain valid
        for historical verification. Every response uses Cache-Control no-store.
        Invalid or unavailable snapshots return 503, never an empty successful
