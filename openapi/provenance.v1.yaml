          $ref: "#/components/schemas/Timestamp"
          description: Expiry of the currently accepted connection credential, when one exists.
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
    RunnerPage:
      type: object
      additionalProperties: false
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Runner"
        page:
          $ref: "#/components/schemas/PageInfo"
    CreateRunnerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        tokenTtlSeconds:
          $ref: "#/components/schemas/RegistrationTokenTtlSeconds"
    RunnerRegistration:
      type: object
      additionalProperties: false
      description: >-
        Secret-producing response. Token plaintext is returned exactly once;
        only its SHA-256 hash and audit identity are retained. An identical
        request replay after response loss returns `credential_not_replayable`.
      required:
        [runnerId, organizationId, registrationToken, createdAt, expiresAt]
      properties:
        runnerId:
          $ref: "#/components/schemas/StableId"
        organizationId:
          $ref: "#/components/schemas/StableId"
        registrationToken:
          $ref: "#/components/schemas/RunnerRegistrationToken"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
          description: >-
            No later than 900 seconds after createdAt. Expiry is an exclusive
            redemption boundary.
    RedeemRunnerRegistrationRequest:
      type: object
      additionalProperties: false
      required: [publicKey, possessionProof, credentialTtlSeconds]
      properties:
        publicKey:
          $ref: "#/components/schemas/Ed25519PublicKey"
        possessionProof:
          $ref: "#/components/schemas/Ed25519Signature"
        credentialTtlSeconds:
          $ref: "#/components/schemas/RunnerCredentialTtlSeconds"
    RunnerRegistrationRedemption:
      type: object
      additionalProperties: false
      description: >-
        Atomic one-time redemption result. Credential plaintext is returned
        exactly once and only its hash is retained; response-loss replay is
        `credential_not_replayable` rather than plaintext recovery.
      required:
        - runnerId
        - organizationId
        - credentialId
        - credential
        - issuedAt
        - expiresAt
        - publicKeyFingerprint
      properties:
        runnerId:
          $ref: "#/components/schemas/StableId"
        organizationId:
          $ref: "#/components/schemas/StableId"
        credentialId:
          $ref: "#/components/schemas/StableId"
        credential:
          $ref: "#/components/schemas/RunnerConnectionCredential"
        issuedAt:
          $ref: "#/components/schemas/Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
          description: No later than 3600 seconds after issuedAt; expiry is exclusive.
        publicKeyFingerprint:
          $ref: "#/components/schemas/PublicKeyFingerprint"
    UpdateRunnerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        draining:
          type: boolean
        quarantined:
          type: boolean
          description: >-
            When true, rejects new and existing credentials and jobs until an
            authorized update clears quarantine. It does not erase audit state.
    RotateRunnerCredentialRequest:
      type: object
      additionalProperties: false
      required: [rotationId, credentialTtlSeconds, overlapSeconds]
      properties:
        rotationId:
          allOf:
            - $ref: "#/components/schemas/StableId"
          description: >-
            Canonical lowercase UUID used unchanged as runner protocol
            RotateCredential.rotation_id. Reuse with different parameters is a
            conflict; exact duplicate delivery is replay-safe.
        credentialTtlSeconds:
          $ref: "#/components/schemas/RunnerCredentialTtlSeconds"
        overlapSeconds:
          $ref: "#/components/schemas/RunnerCredentialOverlapSeconds"
    RevokeRunnerCredentialsRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
    RunnerCredential:
      type: object
      additionalProperties: false
      description: >-
        Secret-producing rotation response. Credential plaintext is returned
        exactly once while the credential authority stores only its SHA-256
        hash and stable audit identity. A bounded encrypted protocol-delivery
        envelope is not an HTTP replay capability and is erased after
        acknowledgement, successful reconnect, or the predecessor deadline.
        Identical response-loss replay returns `credential_not_replayable`; no
        replacement secret is minted.
      required:
        - runnerId
        - organizationId
        - credentialId
        - rotationId
        - credential
        - issuedAt
        - expiresAt
        - predecessorExpiresAt
      properties:
        runnerId:
          $ref: "#/components/schemas/StableId"
        organizationId:
          $ref: "#/components/schemas/StableId"
        credentialId:
          $ref: "#/components/schemas/StableId"
        rotationId:
          $ref: "#/components/schemas/StableId"
        credential:
          $ref: "#/components/schemas/RunnerConnectionCredential"
        issuedAt:
          $ref: "#/components/schemas/Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
          description: No later than 3600 seconds after issuedAt; expiry is exclusive.
        predecessorExpiresAt:
          $ref: "#/components/schemas/Timestamp"
          description: >-
            Exclusive predecessor-credential deadline and the exact
            RotateCredential.reconnect_before value. It is after issuedAt,
            before expiresAt, and at most 300 seconds after issuedAt.
    RunnerCredentialRevocation:
      type: object
      additionalProperties: false
      required: [id, runnerId, organizationId, reason, revokedAt, state]
      properties:
        id:
          $ref: "#/components/schemas/StableId"
        runnerId:
          $ref: "#/components/schemas/StableId"
        organizationId:
          $ref: "#/components/schemas/StableId"
        reason:
