openapi: 3.1.1
info:
  title: Provenance Public API
  version: 1.0.0-alpha.1
  description: >-
    Authoritative public HTTP contract for Provenance. This document defines
    resource shapes and protocol semantics; it does not prescribe private
    platform implementation details.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /
    description: Same-origin API endpoint.
security:
  - BearerAuth: []
  - SessionCookie: []
tags:
  - name: authentication
    description: User, automation, and GitHub OIDC authentication.
  - name: organizations-projects
    description: Tenant and project resources.
  - name: github
    description: GitHub App installations, repository connections, and webhooks.
  - name: artifacts
    description: Immutable plugin artifact upload and inspection.
  - name: release-candidates
    description: Release candidate lifecycle and events.
  - name: verification
    description: Verification records, attestations, public pages, and badges.
  - name: integrations
    description: Project release integrations.
  - name: runners
    description: Organization-scoped self-hosted runner management.
  - name: usage
    description: Organization usage observations.
paths:
  /v1/admin/runner-updates:
    get:
      operationId: getHostedRunnerUpdates
      parameters:
        - name: runnerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedRunnerUpdateView"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/HostedProblem400"
        "401":
          $ref: "#/components/responses/HostedProblem401"
        "403":
          $ref: "#/components/responses/HostedProblem403"
        "404":
          $ref: "#/components/responses/HostedProblem404"
        "503":
          $ref: "#/components/responses/HostedProblem503"
        "429":
          $ref: "#/components/responses/HostedProblem429"
        default:
          $ref: "#/components/responses/HostedProblem503"
      security:
        - SessionCookie: []
      summary: getHostedRunnerUpdates
      tags:
        - authentication
    post:
      operationId: changeHostedRunnerUpdate
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 128
            minLength: 8
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostedRunnerUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedRunnerMutationResult"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/HostedProblem400"
        "401":
          $ref: "#/components/responses/HostedProblem401"
        "403":
          $ref: "#/components/responses/HostedProblem403"
        "404":
          $ref: "#/components/responses/HostedProblem404"
        "409":
          $ref: "#/components/responses/HostedProblem409"
        "503":
          $ref: "#/components/responses/HostedProblem503"
        "429":
          $ref: "#/components/responses/HostedProblem429"
        default:
          $ref: "#/components/responses/HostedProblem503"
      security:
        - SessionCookie: []
      summary: Manage platform-hosted runner binary updates
      tags:
        - authentication
  /v1/runner-updater/{runnerId}/poll:
    post:
      operationId: pollHostedRunnerUpdate
      parameters:
        - name: runnerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            maxLength: 36
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HostedUpdaterPoll"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostedUpdaterCommand"
          description: OK
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/HostedProblem400"
        "401":
          $ref: "#/components/responses/HostedProblem401"
        "403":
          $ref: "#/components/responses/HostedUpdaterProblem403"
        "404":
          $ref: "#/components/responses/HostedProblem404"
        "409":
          $ref: "#/components/responses/HostedUpdaterProblem409"
        "503":
          $ref: "#/components/responses/HostedUpdaterProblem503"
        "429":
          $ref: "#/components/responses/HostedProblem429"
        default:
          $ref: "#/components/responses/HostedUpdaterProblem503"
      security:
        - HostedRunnerUpdater: []
      summary: Poll and report a node-bound hosted update
      tags:
        - authentication
  /v1/admin/organizations:
    get:
      operationId: listAlphaOrganizations
      summary: List alpha organizations
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. See alpha-administration-semantics.md for
        admission, conflict precedence, retention and pagination rules."
      tags:
        - organizations-projects
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The bounded collection at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaOrganizationPage"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
  /v1/account:
    get:
      operationId: getAlphaAccount
      summary: Read current account and administrator access
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. See alpha-administration-semantics.md for
        admission, conflict precedence, retention and pagination rules."
      tags:
        - authentication
      security:
        - SessionCookie: []
      parameters: []
      responses:
        "200":
          description: The current account at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaAccount"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
  /v1/admin/users:
    get:
      operationId: listAlphaUsers
      summary: List alpha users
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. See alpha-administration-semantics.md for
        admission, conflict precedence, retention and pagination rules."
      tags:
        - authentication
      security:
        - SessionCookie: []
      parameters:
        - &a1
          $ref: "#/components/parameters/Cursor"
        - &a2
          $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: The bounded collection at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaUserPage"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
  /v1/admin/invitations:
    get:
      operationId: listAlphaInvitations
      summary: List alpha invitations
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. See alpha-administration-semantics.md for
        admission, conflict precedence, retention and pagination rules."
      tags:
        - authentication
      security:
        - SessionCookie: []
      parameters:
        - *a1
        - *a2
      responses:
        "200":
          description: The bounded collection at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaInvitationPage"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
    post:
      operationId: createAlphaInvitation
      summary: Invite a verified numeric GitHub account for seven days
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. Mutations are audited and use caller-scoped
        idempotency: an unchanged replay returns its original outcome; a changed
        request conflicts. See alpha-administration-semantics.md for admission,
        conflict precedence, retention and pagination rules."
      tags:
        - authentication
      security:
        - SessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "201":
          description: The seven-day invitation, bound to the verified numeric GitHub user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaInvitation"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "409":
          $ref: "#/components/responses/AlphaConflict"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlphaInvitationRequest"
  /v1/admin/runners:
    get:
      operationId: listAlphaRunners
      summary: List alpha runners
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. See alpha-administration-semantics.md for
        admission, conflict precedence, retention and pagination rules."
      tags:
        - runners
      security:
        - SessionCookie: []
      parameters:
        - *a1
        - *a2
      responses:
        "200":
          description: The bounded collection at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaRunnerPage"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
  /v1/admin/executions:
    get:
      operationId: listAlphaExecutions
      summary: List alpha executions
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. See alpha-administration-semantics.md for
        admission, conflict precedence, retention and pagination rules."
      tags:
        - runners
      security:
        - SessionCookie: []
      parameters:
        - *a1
        - *a2
        - name: runnerId
          in: query
          required: false
          schema: &a3
            type: string
            format: uuid
        - name: active
          in: query
          required: false
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: The bounded collection at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaExecutionPage"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
  /v1/admin/usage:
    get:
      operationId: listAlphaUsage
      summary: List alpha usage
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. Interval is half-open [from,to), maximum31
        days. Quantities are exact decimal strings of recorded organization
        observations; pending ingestion is not included. See
        alpha-administration-semantics.md for admission, conflict precedence,
        retention and pagination rules."
      tags:
        - usage
      security:
        - SessionCookie: []
      parameters:
        - *a1
        - *a2
        - name: organizationId
          in: query
          required: false
          schema: *a3
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Timestamp"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Timestamp"
      responses:
        "200":
          description: The bounded collection at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaUsagePage"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
  /v1/admin/invitations/{invitationId}:
    delete:
      operationId: revokeAlphaInvitation
      summary: Revoke an unaccepted invitation
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. Mutations are audited and use caller-scoped
        idempotency: an unchanged replay returns its original outcome; a changed
        request conflicts. See alpha-administration-semantics.md for admission,
        conflict precedence, retention and pagination rules."
      tags:
        - authentication
      security:
        - SessionCookie: []
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: *a3
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The revoked invitation at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaInvitation"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "409":
          $ref: "#/components/responses/AlphaConflict"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
  /v1/admin/users/{userId}/administrator:
    put:
      operationId: setAlphaAdministrator
      summary: Grant or remove administrator access while retaining at least one
        administrator
      description: "Invite-only alpha administration. Requires a current human
        session; API tokens and GitHub Actions grants are forbidden.
        Administrator authority is checked from durable state on every request.
        No credentials or raw logs are returned. Responses are private and
        Cache-Control: no-store. Mutations are audited and use caller-scoped
        idempotency: an unchanged replay returns its original outcome; a changed
        request conflicts. See alpha-administration-semantics.md for admission,
        conflict precedence, retention and pagination rules."
      tags:
        - authentication
      security:
        - SessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema: *a3
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The updated user access at request time.
          headers:
            Cache-Control:
              $ref: "#/components/headers/AlphaNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlphaUser"
        "400":
          $ref: "#/components/responses/AlphaProblem400"
        "401":
          $ref: "#/components/responses/AlphaProblem401"
        "403":
          $ref: "#/components/responses/AlphaProblem403"
        "404":
          $ref: "#/components/responses/AlphaProblem404"
        "409":
          $ref: "#/components/responses/AlphaConflict"
        "429":
          $ref: "#/components/responses/AlphaProblem429"
        "503":
          $ref: "#/components/responses/AlphaProblem503"
        default:
          $ref: "#/components/responses/AlphaProblem503"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlphaAdministratorRequest"
  /v1/release-candidates/{candidateId}/publication-result:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    get:
      operationId: getReleaseCandidatePublicationResult
      summary: Read the exact candidate generation publication result
      description: "IFC-021. Authenticated read using existing tenant/project
        release-candidate read capability. Foreign or missing
        candidate/generation is indistinguishable (404); visible but
        insufficient authority is 403. GitHub Actions grants do not authorize
        this operation. Read one coherent database snapshot without provider
        calls, reconciliation, writes or custody access. Preserve immutable
        aggregate decisions independently of target dispositions and later
        remote knowledge. All responses are Cache-Control: no-store. See
        publication-result-semantics.md; no history or cursor is exposed."
      tags:
        - release-candidates
      x-provenance-interface: IFC-021
      security:
        - BearerAuth: []
        - SessionCookie: []
      parameters:
        - name: generation
          in: query
          required: true
          description:
            Exact retained candidate execution generation; never substituted
            with the current generation.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        "200":
          description:
            One coherent current publication snapshot. Maximum encoded JSON
            body 16384 bytes.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationResult"
        "400":
          description: Invalid generation or request.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "401":
          description: Authentication required.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "403":
          description:
            Visible candidate but insufficient read capability, or unsupported
            automation grant.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "404":
          description: Candidate or generation missing or outside caller visibility.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "405":
          description: Method not allowed. Closed prehandler failure; no-store.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "413":
          description: Request too large. Closed prehandler failure; no-store.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "429":
          description: Too many requests. Closed prehandler failure; no-store.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "500":
          description: Internal server error. Closed prehandler failure; no-store.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
        "503":
          description:
            Implementation or authoritative projection unavailable; no
            fabricated results.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/PublicationResultProblem"
  /v1/auth/github/authorizations:
    post:
      operationId: createGitHubAuthorization
      x-provenance-interface: IFC-017
      summary: Begin server-side GitHub App authorization with S256
      tags: [authentication]
      security: []
      description: >-
        IFC-017 server-to-server operation. The BFF generates and retains the
        verifier server-only, binds the returned independent state and
        authorization ID to its browser session, and enforces same-origin CSRF
        protection. redirectUri must exactly match a configured HTTPS callback
        allowlist; userinfo and fragments are forbidden. No caller-selected
        App/client ID, scopes, provider origin or return URL is permitted. The
        providerUrl uses https://github.com/login/oauth/authorize with the
        configured client ID, exact redirectUri, returned state and supplied
        S256 challenge. Finite server-configured lifetimes are mandatory; expiry
        is immutable. Never log state, verifier, code, provider URL or
        credentials.
      parameters:
        - $ref: "#/components/parameters/GitHubAuthorizationIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGitHubAuthorizationRequest"
      responses:
        "201":
          description:
            Authorization created, or identical initiation replay without
            extending expiry.
          headers:
            Cache-Control:
              $ref: "#/components/headers/GitHubAuthNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GitHubAuthorization"
        "400":
