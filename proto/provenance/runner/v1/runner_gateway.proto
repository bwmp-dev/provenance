syntax = "proto3";

package provenance.runner.v1;

import "common.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/bwmp-dev/provenance/gen/proto/provenance/runner/v1;runnerv1";

service RunnerGateway {
  rpc Connect(stream RunnerMessage) returns (stream GatewayMessage);
}

// With DURABLE_LEASE_ACKNOWLEDGEMENTS, the gateway MUST acknowledge LeaseAccepted,
// LeaseRejected, LeaseRenewal, JobPreparing, JobStarted, JobCompleted, JobFailed, and JobCancelled
// with RunnerEventAcknowledgement. Authenticate, Capabilities, LogBatch, and UsageReport do not
// receive durability acknowledgements.
//
// CREDENTIAL_ROTATION is independent and keeps protocol_version equal to literal "1". A gateway
// MUST send RotateCredential only after the runner advertises CREDENTIAL_ROTATION in Capabilities.
// A non-advertising or mixed-version runner never receives rotation and continues authenticating
// with the released protocol-v1 credential behavior. Disabling rollout stops new rotations but
// does not reinterpret already issued credentials or protocol fields.
message RunnerMessage {
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;

  oneof payload {
    Authenticate authenticate = 10;
    Capabilities capabilities = 11;
    Heartbeat heartbeat = 12;
    LeaseAccepted lease_accepted = 13;
    LeaseRejected lease_rejected = 14;
    LeaseRenewal lease_renewal = 15;
    JobPreparing job_preparing = 16;
    JobStarted job_started = 17;
    LogBatch log_batch = 18;
    UsageReport usage = 19;
    JobCompleted completed = 20;
    JobFailed failed = 21;
    JobCancelled cancelled = 22;
    CredentialRotationAcknowledgement credential_rotation_acknowledgement = 30;
  }

  reserved 3 to 9;
  reserved 23 to 29;
}

message GatewayMessage {
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;

  oneof payload {
    Authenticated authenticated = 10;
    LeaseOffer offer = 11;
    CancelJob cancel = 12;
    DrainRunner drain = 13;
    PolicyUpdate policy_update = 14;
    RotateCredential credential_rotation = 15;
    ShutdownRunner shutdown = 16;
    RunnerEventAcknowledgement event_acknowledgement = 30;
    HeartbeatAcknowledgement heartbeat_acknowledgement = 31;
  }

  reserved 3 to 9;
  reserved 17 to 29;
}

message Authenticate {
  string runner_id = 1;
  string instance_id = 2;
  bytes connection_credential = 3;
  // The canonical wire value remains "1"; optional behavior is negotiated through capabilities.
  string protocol_version = 4;

  reserved 5 to 9;
  reserved "registration_token";
}

message Authenticated {
  string runner_id = 1;
  string connection_id = 2;
  OrganizationScope organization_scope = 3;
  google.protobuf.Timestamp credential_expires_at = 4;
  google.protobuf.Duration heartbeat_interval = 5;
  google.protobuf.Duration lease_duration = 6;
  google.protobuf.Timestamp server_time = 7;
  // The canonical wire value remains "1"; optional behavior is negotiated through capabilities.
  string protocol_version = 8;

  reserved 9 to 15;
}

message HeartbeatLease {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  JobPhase phase = 3;

  reserved 4 to 9;
}

// Every heartbeat receives a HeartbeatAcknowledgement after commit. Its reconciliations MUST
// contain exactly one matching item per active_leases item and no extras; missing or duplicate
// items are protocol errors. Omitted gateway-owned leases remain subject to normal offer,
// cancellation, and expiry recovery and are not implicitly released.
message Heartbeat {
  uint64 sequence = 1;
  Capacity capacity = 2;
  repeated HeartbeatLease active_leases = 3;
  google.protobuf.Timestamp observed_at = 4;

  reserved 5 to 9;
}

message LeaseOffer {
  JobSpecification job = 1;
  google.protobuf.Timestamp offer_expires_at = 2;

  reserved 3 to 9;
}

message LeaseAccepted {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  google.protobuf.Timestamp accepted_at = 3;

  reserved 4 to 9;
}

enum LeaseRejectionReason {
  LEASE_REJECTION_REASON_UNSPECIFIED = 0;
  LEASE_REJECTION_REASON_AT_CAPACITY = 1;
  LEASE_REJECTION_REASON_UNSUPPORTED = 2;
  LEASE_REJECTION_REASON_POLICY = 3;
  LEASE_REJECTION_REASON_DRAINING = 4;
  LEASE_REJECTION_REASON_OFFER_EXPIRED = 5;
}

message LeaseRejected {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  LeaseRejectionReason reason = 3;
  string summary = 4;

  reserved 5 to 9;
}

message LeaseRenewal {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  google.protobuf.Duration requested_extension = 3;
  google.protobuf.Timestamp observed_at = 4;

  reserved 5 to 9;
}

message JobPreparing {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  google.protobuf.Timestamp started_at = 3;

  reserved 4 to 9;
}

message JobStarted {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  google.protobuf.Timestamp started_at = 3;

  reserved 4 to 9;
}

message LogBatch {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  repeated LogEntry entries = 3;
  uint64 dropped_entry_count = 4;

  reserved 5 to 9;
}

message UsageReport {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  uint64 sequence = 3;
  google.protobuf.Timestamp observed_at = 4;
  ResourceUsage cumulative = 5;

  reserved 6 to 9;
}

message JobCompleted {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  StructuredResult result = 3;

  reserved 4 to 9;
}

message JobFailed {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  FailureDetail failure = 3;
  ResourceUsage usage = 4;
  LogObject complete_log = 5;
  google.protobuf.Timestamp failed_at = 6;

  reserved 7 to 9;
}

message JobCancelled {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  string cancellation_id = 3;
  google.protobuf.Timestamp cancelled_at = 4;
  bool cleanup_completed = 5;
  FailureDetail cleanup_failure = 6;

  reserved 7 to 9;
}

message CancelJob {
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  string cancellation_id = 3;
  string reason = 4;
  google.protobuf.Timestamp deadline = 5;
  bool force = 6;

  reserved 7 to 9;
}

message DrainRunner {
  string drain_id = 1;
  string reason = 2;
  google.protobuf.Timestamp deadline = 3;
  bool cancel_active_jobs = 4;

  reserved 5 to 9;
}

message PolicyUpdate {
  string policy_version = 1;
  Digest policy_digest = 2;
  RunnerPolicy policy = 3;
  google.protobuf.Timestamp effective_at = 4;

  reserved 5 to 9;
}

// RotateCredential is sent only when CREDENTIAL_ROTATION was advertised. rotation_id is a
// canonical lowercase UUID and is the immutable idempotency identity. connection_credential is
// exactly 50 canonical ASCII bytes matching
// ^prc_v1_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$; decoders reject any spelling that does not
// decode and unpadded-base64url-re-encode byte-for-byte. expires_at is exclusive and no more than
// 3600 seconds after issued_at. credential_fingerprint is SHA-256 of those exact 50 bytes.
// reconnect_before is after issued_at, before expires_at, and no more than 300 seconds after
// issued_at. It becomes the predecessor-credential deadline only after a delivery attempt.
//
// The gateway may durably queue one rotation while the runner is offline, but MUST NOT attempt
// delivery until a current stream advertises CREDENTIAL_ROTATION. Immediately before writing any
// payload bytes it durably records delivery_attempted. If no delivery attempt is recorded before
// reconnect_before, the gateway abandons the rotation, invalidates the undelivered new credential,
// erases its envelope, retains only non-secret audit identity/fingerprint, and leaves the predecessor
// unchanged. This is also the mixed-version outcome when the runner reconnects without the feature.
// Disabling rollout stops new rotations; already queued rotations still follow these exact attempt
// or abandonment rules.
//
// After delivery_attempted, receipt is potentially ambiguous. The gateway retries the exact payload
// while the envelope exists and acknowledgement is absent. The credential authority retains only a
// hash; the bounded encrypted envelope is unavailable to HTTP response replay and is erased after
// acknowledgement, successful reconnect, or reconnect_before. Reusing rotation_id with different
// bytes, timestamps, or fingerprint is a protocol conflict. The runner MUST atomically persist the
// new credential, complete payload identity, and rotation_id before acknowledgement. An exact
// duplicate is acknowledged again without issuing or overwriting a secret; a conflicting duplicate
// terminates the stream. A crash before persistence yields no acknowledgement and the gateway retries
// during the attempted-delivery overlap. A crash after persistence but before acknowledgement
// re-acknowledges the exact replay after restart.
//
// Delivery does not terminate the active predecessor-authenticated stream. The runner reconnects
// with the new credential before reconnect_before. Successful new-credential authentication revokes
// the predecessor immediately and closes its older stream. After an attempted delivery, failure to
// reconnect with the new credential revokes the predecessor at reconnect_before; an unattempted
// abandoned rotation never revokes it.
// Explicit administrative revocation overrides every queued, attempted, acknowledged, or connected
// rotation and immediately revokes all credentials and streams. The new credential remains subject
// to expires_at and quarantine. Neither message contains private keys or storage credentials.
message RotateCredential {
  string rotation_id = 1;
  bytes connection_credential = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp reconnect_before = 4;
  google.protobuf.Timestamp issued_at = 10;
  bytes credential_fingerprint = 11;

  reserved 5 to 9;
  reserved 12 to 15;
  reserved "registration_token";
}

// Sent only after the runner has durably persisted the exact RotateCredential payload. The
// fingerprint is exactly 32 SHA-256 bytes and must equal the delivered credential_fingerprint.
// An exact duplicate delivery after acknowledgement or restart produces the same acknowledgement;
// the gateway treats a conflicting rotation_id/fingerprint pair as a protocol conflict. This
// acknowledgement proves persistence, not successful reconnect, and therefore does not by itself
// revoke the predecessor before reconnect_before.
message CredentialRotationAcknowledgement {
  string rotation_id = 1;
  bytes credential_fingerprint = 2;
  google.protobuf.Timestamp persisted_at = 3;

  reserved 4 to 9;
}

message ShutdownRunner {
  string shutdown_id = 1;
  string reason = 2;
  google.protobuf.Timestamp deadline = 3;
  bool restart_allowed = 4;

  reserved 5 to 9;
}

enum RunnerMessageDisposition {
  RUNNER_MESSAGE_DISPOSITION_UNSPECIFIED = 0;
  RUNNER_MESSAGE_DISPOSITION_APPLIED = 1;
  RUNNER_MESSAGE_DISPOSITION_ALREADY_APPLIED = 2;
  RUNNER_MESSAGE_DISPOSITION_STALE = 3;
}

enum LeaseStatus {
  LEASE_STATUS_UNSPECIFIED = 0;
  LEASE_STATUS_OFFERED = 1;
  LEASE_STATUS_ACCEPTED = 2;
  LEASE_STATUS_ACTIVE = 3;
  LEASE_STATUS_COMPLETED = 4;
  LEASE_STATUS_CANCELLED = 5;
  LEASE_STATUS_EXPIRED = 6;
  LEASE_STATUS_RELEASED = 7;
}

message LeaseReconciliation {
  // Lease identity, including expiry, reflects authoritative committed gateway state.
  LeaseIdentity lease = 1;
  AttemptIdentity attempt = 2;
  RunnerMessageDisposition disposition = 3;
  LeaseStatus status = 4;
  JobPhase phase = 5;
  string terminal_message_id = 6;
  string cancellation_id = 7;

  reserved 8 to 15;
}

// Sent only after transactional inspection. Reusing a message ID with identical payload yields
// ALREADY_APPLIED; conflicting payloads and invalid events fail the stream as transport errors.
// STALE is nonfatal, and reconciliation always reflects authoritative committed gateway state.
message RunnerEventAcknowledgement {
  string runner_message_id = 1;
  LeaseReconciliation reconciliation = 2;
  google.protobuf.Timestamp committed_at = 3;

  reserved 4 to 9;
}

// Confirms every heartbeat only after its state and authoritative reconciliations commit. An exact
// duplicate message ID and payload re-acks the same ID and sequence with ALREADY_APPLIED for every
// lease; a zero-lease acknowledgement confirms the prior commit itself. Reusing an ID with another
// payload, or a sequence with another ID, is a transport conflict.
message HeartbeatAcknowledgement {
  string runner_message_id = 1;
  uint64 sequence = 2;
  repeated LeaseReconciliation reconciliations = 3;
  google.protobuf.Timestamp committed_at = 4;

  reserved 5 to 9;
}
