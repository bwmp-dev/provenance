import org.gradle.api.tasks.testing.TestDescriptor
import org.gradle.api.tasks.testing.TestListener
import org.gradle.api.tasks.testing.TestResult
import org.gradle.jvm.tasks.Jar
import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
    id "base"
}

group = "dev.provenance"
version = "0.1.0-alpha.1"

def safeFixtures = [
    ":fixture-success",
    ":fixture-on-load-failure",
    ":fixture-on-enable-failure",
    ":fixture-missing-dependency",
    ":fixture-command-success",
    ":fixture-command-assertion-failure",
]

def hostileFixtures = [
    ":fixture-enable-hang",
    ":fixture-process-exit",
    ":fixture-memory-bomb",
    ":fixture-fork-pid-bomb",
    ":fixture-disk-fill",
    ":fixture-network-scan",
    ":fixture-metadata-endpoint",
    ":fixture-log-flood",
]

subprojects {
    apply plugin: "java-library"

    group = rootProject.group
    version = "1.0.0"

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
        options.debug = false
    }

    tasks.withType(Jar).configureEach {
        archiveFileName = "${project.name.replace('fixture-', '')}-${project.version}.jar"
        preserveFileTimestamps = false
        reproducibleFileOrder = true
        dirPermissions { unix("0755") }
        filePermissions { unix("0644") }
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

}

configure(safeFixtures.collect { project(it) } + hostileFixtures.collect { project(it) }) {
    dependencies {
        compileOnly project(":paper-api-stubs")
    }
}

project(":fixture-fork-pid-bomb") {
    dependencies {
        testImplementation platform("org.junit:junit-bom:6.1.3")
        testImplementation "org.junit.jupiter:junit-jupiter"
        testImplementation files(rootProject.project(":paper-api-stubs").sourceSets.main.output)
        testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    }

    tasks.named("test") {
        addTestListener(new TestListener() {
            @Override
            void beforeSuite(TestDescriptor descriptor) {}

            @Override
            void afterSuite(TestDescriptor descriptor, TestResult result) {
                if (descriptor.parent == null) {
                    println(
                        "fork-pid-bomb focused suite: ${result.testCount} tests; " +
                            "${result.successfulTestCount} passed; ${result.failedTestCount} failed; " +
                            "${result.skippedTestCount} skipped",
                    )
                }
            }

            @Override
            void beforeTest(TestDescriptor descriptor) {}

            @Override
            void afterTest(TestDescriptor descriptor, TestResult result) {}
        })
    }
}

project(":paper-api-stubs") {
    tasks.named("jar") {
        enabled = false
    }
}

project(":paper-probe") {
    version = "0.1.0"

    def paperApiVersion = "1.21.8-R0.1-SNAPSHOT"
    def paperApiArtifact = configurations.create("paperApiArtifact") {
        canBeConsumed = false
        transitive = false
    }

    dependencyLocking {
        lockAllConfigurations()
    }

    dependencies {
        compileOnly("io.papermc.paper:paper-api:${paperApiVersion}")
        compileOnly("org.apache.logging.log4j:log4j-core:2.24.1")
        add(paperApiArtifact.name, "io.papermc.paper:paper-api:${paperApiVersion}")
        implementation("com.google.re2j:re2j:1.8")
        implementation("org.snakeyaml:snakeyaml-engine:2.10")
        testImplementation(platform("org.junit:junit-bom:6.1.3"))
        testImplementation("org.junit.jupiter:junit-jupiter")
        testImplementation("org.apache.logging.log4j:log4j-core:2.24.1")
        testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    }

    def runtimeDependencyInventory = layout.projectDirectory.file("runtime-dependencies.json")
    def paperProbeRuntimeArtifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
        def id = artifact.moduleVersion.id
        [coordinate: "${id.group}:${artifact.name}:${id.version}".toString(), path: artifact.file.absolutePath]
    }
    tasks.register("verifyRuntimeDependencyArtifacts") {
        group = "verification"
        inputs.file(runtimeDependencyInventory)
        inputs.files(paperProbeRuntimeArtifacts.collect { artifact -> artifact.path })
        doLast {
            def inventory = new JsonSlurper().parse(runtimeDependencyInventory.asFile)
            if (!(inventory instanceof List)) {
                throw new GradleException("runtime dependency inventory must be an array")
            }
            def expectedFields = ["artifact", "checksum", "group", "license", "version"] as Set
            def expected = [:]
            inventory.each { dependency ->
                if (!(dependency instanceof Map) || dependency.keySet() as Set != expectedFields) {
                    throw new GradleException("runtime dependency inventory entry has invalid fields")
                }
                def coordinate = "${dependency.group}:${dependency.artifact}:${dependency.version}".toString()
                if (expected.put(coordinate, dependency) != null) {
                    throw new GradleException("runtime dependency inventory contains duplicate coordinate: ${coordinate}")
                }
                if (!(dependency.checksum ==~ /[0-9a-f]{64}/) || !(dependency.license instanceof String) || dependency.license.isEmpty()) {
                    throw new GradleException("runtime dependency inventory entry is invalid: ${coordinate}")
                }
            }

            def resolved = [:]
            paperProbeRuntimeArtifacts.each { artifact ->
                if (resolved.put(artifact.coordinate, new File(artifact.path)) != null) {
                    throw new GradleException("runtime classpath contains duplicate coordinate: ${artifact.coordinate}")
                }
            }
            if (expected.keySet() != resolved.keySet()) {
                throw new GradleException("runtime dependency inventory differs from resolved runtimeClasspath")
            }
            resolved.each { coordinate, artifact ->
                def actual = MessageDigest.getInstance("SHA-256").digest(artifact.bytes).encodeHex().toString()
                if (actual != expected[coordinate].checksum) {
                    throw new GradleException("runtime dependency checksum differs: ${coordinate}")
                }
            }
        }
    }

    tasks.named("jar") {
        dependsOn("verifyRuntimeDependencyArtifacts")
        archiveFileName = "paper-probe-${project.version}.jar"
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest {
            attributes("Main-Class": "dev.provenance.probe.MetadataInspectorMain")
        }
        from({
            configurations.runtimeClasspath.collect { dependency ->
                dependency.isDirectory() ? dependency : zipTree(dependency)
            }
        }) {
            exclude("META-INF/MANIFEST.MF", "META-INF/*.DSA", "META-INF/*.RSA", "META-INF/*.SF")
        }
    }

    def stagedPaperApi = layout.buildDirectory.dir("dependency-verification/paper-api")
    tasks.register("stagePaperApiArtifact", Sync) {
        from(paperApiArtifact)
        into(stagedPaperApi)
    }
    tasks.register("verifyPaperApiArtifact", Exec) {
        group = "verification"
        dependsOn("stagePaperApiArtifact")
        commandLine(
            "node",
            rootProject.file("scripts/verify-paper-api.mjs"),
            stagedPaperApi.get().asFile,
            "aab18363ca5a1aaadd4e2716ee0de50bc26f352901af962177d86484baff7478",
        )
    }
    tasks.named("check") {
        dependsOn("verifyRuntimeDependencyArtifacts")
    }
}

tasks.register("safeFixtures") {
    group = "build"
    description = "Builds only bounded behavioral fixture JARs."
    dependsOn(safeFixtures.collect { "${it}:jar" })
}

tasks.register("hostileFixtures") {
    group = "build"
    description = "Explicitly builds sandbox-attack fixture JARs without executing them."
    dependsOn(hostileFixtures.collect { "${it}:jar" })
}

tasks.register("verifySafeFixtureArtifacts", Exec) {
    group = "verification"
    dependsOn("safeFixtures")
    commandLine("node", "packages/test-fixtures/scripts/verify-fixtures.mjs")
}

tasks.register("verifyHostileFixtureArtifacts", Exec) {
    group = "verification"
    dependsOn("safeFixtures", "hostileFixtures")
    commandLine(
        "node",
        "packages/test-fixtures/scripts/verify-fixtures.mjs",
        "--include-hostile",
    )
}

tasks.register("writeFixtureHashes", Exec) {
    group = "build setup"
    description = "Builds every fixture and mechanically regenerates the fixture hash manifest."
    dependsOn("safeFixtures", "hostileFixtures")
    commandLine(
        "node",
        "packages/test-fixtures/scripts/verify-fixtures.mjs",
        "--include-hostile",
        "--write",
    )
}

tasks.register("resolveAndLockAll") {
    group = "build setup"
    description = "Resolves the external dependency graph for dependency lock generation."
    dependsOn(":paper-probe:dependencies")
}

tasks.named("check") {
    dependsOn(
        ":fixture-fork-pid-bomb:test",
        ":paper-probe:check",
        ":paper-probe:verifyPaperApiArtifact",
        "verifySafeFixtureArtifacts",
        "verifyHostileFixtureArtifacts",
    )
}

tasks.named("assemble") {
    dependsOn(":paper-probe:jar", "safeFixtures")
}
